<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bug oder Feature?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  --green:#4CC265; --green-deep:#2E9A48; --green-tint:#E9F8EC;
  --blue:#3B82C4; --blue-tint:#E7F0FA;
  --orange:#D9552B; --orange-tint:#FBECE6;
  --gold:#E6A817; --gold-tint:#FCF3DC;
  --ink:#111114; --ink-2:#3E4441; --ink-3:#6B7370;
  --line:#DCE3DE; --line-soft:#ECF0ED;
  --bg:#F9FAFB; --card:#FFFFFF; --track:#EDF1EE;
  --shadow:0 1px 2px rgba(17,17,20,.06), 0 8px 24px rgba(17,17,20,.06);
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green-deep:#6BD883; --green-tint:#17301D;
    --blue-tint:#15263A; --orange-tint:#3A1D14; --gold-tint:#3A2C0E;
    --ink:#F4F6F4; --ink-2:#C9CFCB; --ink-3:#8F9994;
    --line:#2C332F; --line-soft:#232926;
    --bg:#111114; --card:#1A1D1B; --track:#262B28;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --logo-light:none; --logo-dark:block;
  }
}
:root[data-theme="dark"]{
  --green-deep:#6BD883; --green-tint:#17301D;
  --blue-tint:#15263A; --orange-tint:#3A1D14; --gold-tint:#3A2C0E;
  --ink:#F4F6F4; --ink-2:#C9CFCB; --ink-3:#8F9994;
  --line:#2C332F; --line-soft:#232926;
  --bg:#111114; --card:#1A1D1B; --track:#262B28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --logo-light:none; --logo-dark:block;
}
*{box-sizing:border-box}
body.embedded{background:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.os{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:500;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,8vw,64px);line-height:.98;text-transform:uppercase}
h2{font-size:clamp(26px,4.5vw,34px);line-height:1.1;text-transform:uppercase}
h3{font-size:20px;line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
a{color:var(--green-deep)}
.eyebrow{font-family:"DM Sans";font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
.muted{color:var(--ink-3)}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 40px}
body.embedded .wrap{padding:0 0 8px}
.frame{background:var(--card);border-top:3px solid var(--green);border-bottom:3px solid var(--green);box-shadow:var(--shadow);position:relative}
.frame::after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--green);opacity:.55}
.frame::before{content:"";position:absolute;left:0;right:0;bottom:9px;height:1px;background:var(--green);opacity:.55}
.head{display:flex;justify-content:space-between;align-items:center;padding:26px 32px 0}
.logo{display:block;line-height:0}
.logo img{height:36px;width:auto}
.logo .logo-light{display:var(--logo-light,block)}
.logo .logo-dark{display:var(--logo-dark,none)}
.progress{height:3px;background:var(--track);margin:18px 32px 0;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .35s ease}
.stepline{display:flex;justify-content:space-between;padding:8px 32px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.screen{display:none;padding:28px 32px 36px}
.screen.on{display:block}
@media (max-width:560px){.head,.progress,.stepline,.screen{padding-left:18px;padding-right:18px}.progress{margin-left:18px;margin-right:18px}}
.lead{font-size:18px;color:var(--ink-2);max-width:60ch}
.stack{display:grid;gap:22px}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;cursor:pointer;padding:13px 22px;background:var(--ink);color:var(--bg);letter-spacing:.02em;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.choice:focus-visible,.seg button:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--green);color:#0B1F10}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);padding:11px 18px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line-soft)}
.choices{display:grid;gap:10px}
.choice{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);padding:16px 18px;color:var(--ink);display:grid;gap:3px;transition:border-color .15s,background .15s}
.choice b{font-family:Oswald;font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.choice span{color:var(--ink-3);font-size:14px}
.choice:hover{border-color:var(--green)}
.choice.sel{border-color:var(--green);background:var(--green-tint)}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.choices.row .choice{padding:14px 14px}
.choices.row .choice b{font-size:17px}
.names{display:grid;gap:8px}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namegrid label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);padding:0 12px;background:var(--card)}
.namegrid input{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:12px 0;width:100%;min-width:0}
.namegrid input:focus{outline:none}
.namegrid label:focus-within{border-color:var(--green)}
.dot-a,.dot-b{flex:none;width:12px;height:12px;border-radius:50%;background:var(--green)}
.dot-b{background:var(--blue)}
@media (max-width:560px){.namegrid{grid-template-columns:1fr}}
.side-row{display:grid;gap:2px;margin-top:10px}
.side-row label{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;font-weight:500}
/* axis block */
.axis{border-top:1px solid var(--line-soft);padding-top:22px}
.axis:first-child{border-top:0;padding-top:0}
.axis .q{font-size:18px;font-weight:500;max-width:62ch;margin:4px 0 14px}
.axis .name{display:flex;align-items:baseline;gap:10px}
.axis .name .os{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.poles{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-3);margin-top:6px}
.poles span{max-width:45%}
.poles span:last-child{text-align:right}
.poles b{display:block;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:1px}
.sl{position:relative;height:34px;display:flex;align-items:center}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--track);border-radius:3px}
.sl::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;margin-left:-1px;background:var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;position:relative;z-index:1;height:34px}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent}
input[type=range]::-moz-range-track{height:6px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--green);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--green);margin-top:-9px;cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--green);cursor:grab}
input[type=range].other::-webkit-slider-thumb{background:var(--card);box-shadow:0 0 0 2.5px var(--blue)}
input[type=range].other::-moz-range-thumb{background:var(--card);box-shadow:0 0 0 2.5px var(--blue)}
input[type=range].b::-webkit-slider-thumb{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
input[type=range].b::-moz-range-thumb{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.sub{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:14px}
.sub label{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--line)}
.seg button{font:inherit;font-size:13px;font-weight:500;background:transparent;border:0;border-left:1.5px solid var(--line);padding:7px 12px;cursor:pointer;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button.sel{background:var(--ink);color:var(--bg)}
.other-row{margin-top:12px;padding:12px 14px;background:var(--blue-tint);display:grid;gap:4px}
.other-row label{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.other-row label::before{content:"";width:10px;height:10px;border-radius:50%;border:2.5px solid var(--blue);background:var(--card)}
@media (max-width:560px){.sub{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1}}
/* result */
.verdict{display:grid;gap:8px;padding:22px 24px;border-left:6px solid var(--gold);background:var(--gold-tint)}
.verdict.bug{border-color:var(--orange);background:var(--orange-tint)}
.verdict.schwel{border-color:var(--blue);background:var(--blue-tint)}
.verdict h2{font-size:clamp(34px,6vw,48px)}
.verdict p{max-width:62ch}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--track);color:var(--ink-2);vertical-align:middle}
.pill.fix{background:var(--orange);color:#fff}
.pill.tend{background:var(--gold-tint);color:#7A5300}
.pill.gap{background:var(--blue-tint);color:var(--blue)}
.dim{margin-top:22px}
.dim h3{color:var(--ink-3);font-size:13px;letter-spacing:.14em;padding-bottom:8px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.row .l,.row .r{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);line-height:1.3}
.row .r{text-align:right}
.row .l b,.row .r b{display:block;font-family:Oswald;font-weight:500;font-size:14px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.row .pills{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.track{position:relative;height:28px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--track);border-radius:3px}
.track::after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;background:var(--line)}
.dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--green);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--green);z-index:2}
.dot.fix{background:var(--orange);box-shadow:0 0 0 1.5px var(--orange)}
.dot.tend{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.dot.o{background:var(--card);box-shadow:0 0 0 2.5px var(--blue);width:12px;height:12px;margin:-6px 0 0 -6px;z-index:1}
.dot.b{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue);z-index:1}
.dot.ring{box-shadow:0 0 0 3px var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:6px}.row .r{text-align:left}.row .track{order:-1}}
.moves{display:grid;gap:14px;margin-top:10px}
.move{padding:18px 20px;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--orange);display:grid;gap:8px}
.move.up{border-left-color:var(--blue)}
.move .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.move.up .tag{color:var(--blue)}
.move .skill{font-size:14px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.move .skill b{font-weight:700;color:var(--ink)}
.callout{padding:18px 20px;background:var(--green-tint);border-left:5px solid var(--green);display:grid;gap:6px}
.callout.ink{background:var(--ink);color:var(--bg);border-left-color:var(--green)}
.callout.ink .eyebrow{color:var(--green)}
.callout.ink a{color:var(--green)}
.quote{font-family:Oswald;font-size:clamp(22px,4vw,30px);line-height:1.15;text-transform:uppercase;font-weight:500;margin:6px 0}
.foot{font-size:12px;color:var(--ink-3);padding:18px 32px 26px;max-width:60ch}
.demo{font-size:13px;color:var(--ink-3);border:1px dashed var(--line);padding:10px 12px}
.count{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.axis .name .count{margin-left:auto}
.move .pick{justify-self:start;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:transparent;border:1.5px solid var(--line);color:var(--ink-2);padding:6px 12px;margin-top:4px}
.move .pick:hover{border-color:var(--green)}
.move .pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.move .pick[disabled]{opacity:.4;cursor:not-allowed}
.move .pick:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.move.picked{box-shadow:0 0 0 2px var(--green)}
.ta{font:inherit;font-size:15px;width:100%;min-height:84px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;resize:vertical;margin-top:6px}
.ta:focus{outline:none;border-color:var(--green)}
.callout.counter{background:var(--orange-tint);border-left-color:var(--orange)}
.callout.counter .eyebrow{color:var(--ink-2)}
.callout.export{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--green)}
.export-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.toast{font-size:13px;color:var(--green-deep);min-height:1em}
#printSheet{display:none}
@media print{
  @page{margin:18mm}
  body{background:#fff!important;color:#111114}
  .wrap{display:none!important}
  #printSheet{display:block!important;font-family:"DM Sans",Arial,sans-serif;font-size:11pt;line-height:1.5;color:#111114}
  #printSheet h1{font-family:Oswald,Arial,sans-serif;font-weight:500;text-transform:uppercase;font-size:22pt;border-bottom:3px solid #4CC265;padding-bottom:6px;margin:0 0 6px}
  #printSheet h2{font-family:Oswald,Arial,sans-serif;font-weight:500;text-transform:uppercase;font-size:12pt;letter-spacing:.06em;color:#2E9A48;margin:16px 0 4px}
  #printSheet ul{margin:0;padding-left:18px}
  #printSheet li{margin:3px 0;break-inside:avoid}
  #printSheet .m{color:#6B7370;font-size:9.5pt;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  q:{partei:'Worum geht es gerade? Noch um die eine konkrete Sache, oder inzwischen um „immer", „nie" und „grundsätzlich"?',beob:'Streitet diese Seite noch über den konkreten Punkt, oder ist für sie längst alles Thema?'},
  lp:'Aus der Mücke ist ein Elefant geworden',rp:'Es geht um genau einen Punkt',
  down:'Verlagere die Aufmerksamkeit vom Generellen zum Spezifischen. Wo genau liegt der Unterschied? Wo seid ihr euch längst einig? Das Trennende eingrenzen, das Gemeinsame benennen.',
  up:'Wenn immer nur der Einzelfall besprochen wird, kann das Bagatellisierung sein. Den Elefanten hinter der Mücke benennen: Worum geht es hier eigentlich?',
  sdown:'Konkretisieren: Trennendes eingrenzen, Gemeinsamkeiten sichtbar machen.',sup:'Verallgemeinern dürfen: das Muster hinter dem Einzelfall aussprechen.'},
 {id:'bes',dim:'sache',name:'Beschreibung',left:'einfältig',right:'vielfältig',
  q:{partei:'Gibt es aus deiner Sicht genau eine richtige Lösung, oder könntest du mehrere Sichtweisen gelten lassen?',beob:'Lässt diese Seite mehrere Sichtweisen auf Problem und Lösung zu, oder gilt für sie nur eine?'},
  lp:'Es gibt eine richtige Sicht: meine',rp:'Es gibt mehrere brauchbare Sichten',
  down:'Die Situation ist vielfältig, die Ansichten sind einfältig. Hol weitere Perspektiven ins Spiel: Fachleute, Betroffene, die Sicht aus dem Ganzen statt aus dem eigenen Bereich.',
  up:'Endloses Abwägen ist auch eine Fixierung. Wenn ein Einigungszwang besteht (Was? Wann? Wer?), braucht es Einfalt: einen Rahmen, eine Frist, eine Entscheidung. Ein Kompromiss darf dabei sachlich unvollkommen sein.',
  sdown:'Perspektivwechsel: andere Sichten als brauchbar sehen können.',sup:'Entscheidungsmut: Vielfalt begrenzen und festlegen.'},
 {id:'bew',dim:'sache',name:'Bewertung',left:'verabsolutiert',right:'unklar',
  q:{partei:'Wie sicher bist du, dass die andere Seite falsch liegt?',beob:'Argumentiert diese Seite mit richtig und falsch, gut und böse, oder kann sie offen lassen, wer am Ende recht hat?'},
  lp:'Ich habe recht. Punkt.',rp:'Beide könnten recht haben',
  down:'Wer der Bewertung widerspricht, widerspricht hier der Person. Bewegung wird erst möglich, wenn die bedrohte Identität anders Halt findet: erst Anerkennung, dann die Bewertung lockern.',
  up:'Ohne Einigkeit in den Bewertungen schwelt der Konflikt weiter. Irgendwann muss jemand sagen, was gilt. Standpunkte brauchen auch Kraft und Eindeutigkeit.',
  sdown:'Mentalisierung und Ambiguitätstoleranz: die Welt mit den Augen des anderen sehen und Unklarheit aushalten.',sup:'Standpunkt beziehen: Bewertungen mit Entschlossenheit aufladen.'},
 {id:'kon',dim:'sozial',name:'Kontakt',left:'feindlich',right:'dialogisch',
  q:{partei:'Erwartest du von der anderen Seite noch irgendetwas Gutes?',beob:'Unterstellt diese Seite der anderen Absicht, oder rechnet sie noch mit guten Motiven?'},
  lp:'Der andere will mir schaden',rp:'Der andere hat Gründe, die ich verstehen könnte',
  down:'Der Feind legitimiert die Aggression, die Aggression schafft den Feind. Prüfe die Unterstellungen: Welche Motive könnte die andere Seite haben, die nichts mit dir zu tun haben?',
  up:'Wer nur Dialog anbietet, kommt oft nicht zum Punkt. Der Konflikt schwelt. Hier darf jemand in den Ring steigen und Klartext sprechen, auch wenn das unfreundlich wirkt.',
  sdown:'Unterstellungen prüfen, Motive erkunden.',sup:'Mut zum Klartext: Gegnerschaft aushalten.'},
 {id:'rea',dim:'sozial',name:'Reaktion',left:'verneinend',right:'wählend',
  q:{partei:'Wenn die andere Seite morgen etwas vorschlägt: Weißt du jetzt schon, dass du Nein sagst?',beob:'Sagt diese Seite reflexhaft Nein zu allem, oder wählt sie noch, worauf sie wie reagiert?'},
  lp:'Nein. Egal, was kommt.',rp:'Kommt drauf an, was kommt',
  down:'Der Sog zum Nein hat übernommen. Es geht nicht darum, Ja statt Nein zu sagen, sondern wieder wählen zu können: Was in der Aussage des anderen lässt sich bejahen?',
  up:'Manche Ordnung verflüssigt sich nur, wenn jemand entschieden widerspricht. Ein Nein, das Nein bleibt, auch wenn es zum Ja gedrängt wird, bricht Konfliktsymbiosen auf.',
  sdown:'Vom Reflex zur Wahl: im Anderen etwas Bejahbares hören.',sup:'Beim Nein bleiben, Druck aushalten.'},
 {id:'akt',dim:'sozial',name:'Aktion',left:'sendend',right:'erkundend',
  q:{partei:'Wer hat in den letzten Gesprächen mehr geredet als gefragt?',beob:'Redet diese Seite nur, oder erkundet sie noch, was die andere meint?'},
  lp:'Zwei Lautsprecher, kein Mikrofon',rp:'Was könnte der andere gemeint haben?',
  down:'Lautstärke erhöhen bringt nichts, wenn kein Mikrofon im Raum ist. Eigene Inhalte zurückstellen und auf das Bezug nehmen, was gesagt wurde. Erst verstehen, dann senden.',
  up:'Ständiges Erkunden kann dazu dienen, den Konflikt verborgen zu halten. Manchmal braucht es eine laute, zugespitzte, unbeeindruckbare Botschaft, damit überhaupt ein Konflikt entsteht, der sich bearbeiten lässt.',
  sdown:'Zuhören: Explore, Absorb, Transform (EAT).',sup:'Senden: Botschaft setzen, zuspitzen, dranbleiben.'},
 {id:'erk',dim:'zeit',name:'Erklärung',left:'linear',right:'zirkulär',
  q:{partei:'Wenn du erklärst, wie es dazu kam: Gibt es da einen Täter?',beob:'Sucht diese Seite den Schuldigen, oder sieht sie ihren eigenen Beitrag?'},
  lp:'Einer ist schuld',rp:'Alle haben beigetragen',
  down:'Wer einen Täter hat, wird handlungsfähig, und der Beschuldigte fühlt sich zum Zurückschlagen berechtigt. Henne oder Ei? Beides. Die bessere Frage: Was trage ich selbst gerade zum Konflikt bei?',
  up:'Zirkulär denken kann auch verschleiern. Wo Machtverhältnisse zementiert sind, braucht es eine klare Benennung von Verantwortung, sonst gibt es keinen Konflikt, den man bearbeiten könnte.',
  sdown:'Zirkulär denken: den eigenen Beitrag sehen, ohne Schuldfrage.',sup:'Verantwortung klar zuschreiben, wenn es nötig ist.'},
 {id:'ziel',dim:'zeit',name:'Ziel',left:'durchsetzend',right:'unentschieden',
  q:{partei:'Willst du gewinnen, oder darf offen bleiben, wer sich womit durchsetzt?',beob:'Will diese Seite gewinnen, oder kann sie offen lassen, wer sich womit durchsetzt?'},
  lp:'Ich will gewinnen',rp:'Mal sehen, wer sich womit durchsetzt',
  down:'Solange es um Sieg geht, spielt keine Rolle mehr, wer recht hat. Es gewinnt, wer länger durchhält. Unentschieden aushalten heißt: sich lösen von den Interessen, die man gerade für die eigenen hält.',
  up:'Veränderung braucht eine Kraft, die in den Ring steigt. Wenn niemand gewinnen will, bleibt alles, wie es ist. Manchmal ist es richtig, dass es klare Verlierer gibt.',
  sdown:'Selbst-Losigkeit: Interessen haben, ohne sie zu sein.',sup:'Kraft und Entschlossenheit: sich durchsetzen wollen.'},
 {id:'macht',dim:'zeit',name:'Macht',left:'drohend',right:'verhandelnd',
  q:{partei:'Steht eine Drohung im Raum? Auch eine unausgesprochene?',beob:'Droht diese Seite mit Konsequenzen, oder lotet sie aus, was sie geben und bekommen kann?'},
  lp:'Wenn du nicht, dann ...',rp:'Gibst du mir, gebe ich dir',
  down:'Der Bedroher hat keine Macht, außer man gibt sie ihm. Drohungen sind oft ein Ausweg aus Ohnmacht und ernten Anpassung statt Einverständnis. Zurück ins Verhandeln: Was will jede Seite wirklich, und was wäre sie bereit zu geben?',
  up:'Wer nicht ernst genommen wird, braucht nicht zu reden. Eine glaubwürdige Konsequenz, die man wahrmachen kann und will, ist manchmal die Voraussetzung dafür, dass überhaupt verhandelt wird.',
  sdown:'Ohnmacht aushalten, Interessen statt Positionen verhandeln.',sup:'Die eigene Alternative kennen und benennen, Konsequenzen glaubwürdig machen.'}
 ],

 erg:{
  partei:[
   {q:'Wenn die andere Seite am Ende recht hätte: Was würde das über dich sagen?',o:['Nichts. Dann hatte ich eben unrecht.','Wäre unangenehm.','Dann wäre ich als Person infrage gestellt.']},
   {q:'Könntest du sagen: „Gut, dann nicht. Dann anders, woanders, ein anderes Mal"?',o:['Ja, es gibt andere Wege zu dem, was ich brauche.','Schwer.','Nein. So muss es sein.']},
   {q:'Wie viel Platz nimmt der Konflikt in deinem Kopf ein, wenn du gar nicht im Gespräch bist?',o:['Kaum.','Regelmäßig.','Er läuft ständig mit.']},
   {q:'Gibt es an dem Konflikt ein Gefühl, das du lieber nicht hättest? Scham, Schuld, Angst, Kränkung?',o:['Nein.','Ja, und ich kann es benennen.','Ja, und ich will nicht hinschauen.']}
  ],

   {q:'Haben sich Lager gebildet?',o:['Nein.','Ansatzweise.','Ja, mit Verbündeten auf beiden Seiten.']},

 },
 startsPartei:[['ich','Ich'],['andere','Die andere Seite'],['beide','Beide'],['unklar','Weiß ich nicht mehr']],
 sideA:'Seite A',sideB:'Seite B',both:'Beide',unclear:'Unklar',

 ui:{
  title:'Bug oder<br>Feature?',docTitle:'Bug oder Feature?',
  lead:'Ein Konflikt ist nicht das Problem. Das Problem ist, wenn er festhängt. Neun Regler, ein Profil, und am Ende die Frage, ob dieser Konflikt gerade schüren, beruhigen oder in Ruhe gelassen werden will.',
  roleq:'Von wo schaust du drauf?',r1:'Ich bin Partei',r1s:'Es ist mein Konflikt. Ich stecke drin.',r2:'Ich schaue von außen',r2s:'Zwei Menschen oder Gruppen in meinem Umfeld, ich bin nicht selbst Partei. Führungskraft, HR, Kollegin.',
  note:'Dauert etwa sechs Minuten. Nichts wird gespeichert oder gesendet. Grundlage ist die Konflikttheorie von Klaus Eidenschink.',
  go:'Los',back:'Zurück',next:'Weiter',result:'Ergebnis',
  crumb:'Konflikt-Check',crumbP:'Konflikt-Check · Ich bin Partei',crumbB:'Konflikt-Check · Blick von außen',
  s1e:'Eine Frage vorab',s1h:'Wer hat angefangen?',s1l:'Nicht lange überlegen. Erste Antwort.',
  names:'Die beiden Seiten',nameA:'Seite A, z. B. Vertrieb oder Frau K.',nameB:'Seite B',namesnote:'Optional. Namen bleiben im Browser.',
  d1e:'Sachdimension',d1h:'Worüber wird gestritten?',d1l:'Schieb den Regler dahin, wo der Konflikt gerade steht. Nicht, wo er hin soll.',
  d2e:'Sozialdimension',d2h:'Wie wird miteinander umgegangen?',d3e:'Zeitdimension',d3h:'Vergangenheit, Gegenwart, Zukunft',
  fixq:'Ist das immer so, oder je nach Tag?',fix0:'Je nach Tag',fix2:'Immer so',
  other:'Wo würde die andere Seite den Regler setzen?',
  ergP:'Hast du den Konflikt, oder hat er dich?',ergPe:'Die Kernfrage',ergB:'Hat der Konflikt schon das System?',ergBe:'Die Kernfrage von außen',
  foot:'Prototyp. Theoretische Grundlage: Klaus Eidenschink, „Die Kunst des Konflikts. Konflikte schüren und beruhigen lernen" (Carl-Auer). Die neun Leitunterscheidungen sind seine, die Fragen, Bewertungslogik und Formulierungen stammen von Jacob Noon. Keine Diagnose, kein Ersatz für ein Gespräch.',
  yourResult:'Dein Ergebnis',hasYou:'Der Konflikt hat dich',hasSystem:'Der Konflikt hat das System',
  profile:'Das Bewegungsprofil',profileNote:'Links der Widerspruchspol, rechts der offene Pol. Kein Pol ist falsch. Eingerastet ist das Problem.',
  locked:'eingerastet',tend:'Tendenz',seeDiff:'Ihr seht das anders',lopsided:'Schieflage',
  legMoving:'beweglich',legTend:'weit außen, aber je nach Tag',legLocked:'eingerastet',legOther:'so würde es die andere Seite sehen',
  otherView:'Einschätzung der anderen Seite',
  movesH:'Wo es sich lohnt reinzugehen',
  movesMany:(n,m)=>`${n} Stellen sind eingerastet. Hier die ${m} härtesten, mehr auf einmal trägt kein Gespräch.`,
  movesFixed:'Pro eingerasteter Achse: die Gegenbewegung und die Fähigkeit, die sie braucht.',
  movesTend:'Nichts ist eingerastet. Hier die Achsen mit Tendenz, bevor sie es werden.',
  movesBeob:' Die Bewegung gehört der jeweiligen Seite. Deine Aufgabe von außen: den Rahmen schaffen, in dem sie möglich wird.',
  calm:'Beruhigen',stir:'Schüren',fromTo:(a,b)=>`von ${a} zu ${b}`,skill:'Fähigkeit dahinter:',
  noFix:'Keine Achse ist eingerastet oder kippt gerade. Dein Job ist jetzt nicht, den Konflikt zu beenden, sondern ihn zu einer Entscheidung kommen zu lassen. Achte auf die Sachdimension: Wird noch über die Sache gestritten, oder wandert es Richtung Person?',
  axesN:n=>n===1?'einer Achse':n+' Achsen',
  asymH:'Asymmetrie',asym:(n,list,A,B)=>`Auf ${n} (${list}) stehen ${A} und ${B} drei oder mehr Schritte auseinander. Das ist kein Zufall, sondern oft das Muster selbst: Die härtere Seite eskaliert, weil sie nicht ernst genommen wird. Die weichere Seite hält den Konflikt am Leben, weil nichts entschieden wird. Beide brauchen Bewegung, in entgegengesetzte Richtungen.`,
  gapH:'Fremdregler',gap:(n,list)=>`Auf ${n} (${list}) liegen deine Einschätzung und die vermutete der anderen Seite drei oder mehr Schritte auseinander. Das ist selbst ein Befund: Ihr streitet nicht nur über die Sache, ihr seht auch den Streit verschieden. Wer das laut ausspricht, macht die Kommunikation wieder unvorhersehbar.`,
  firstH:'Noch mal zur ersten Frage',
  firstBoth:e=>`Du hast „Beide" gesagt. Das ist die zirkuläre Sicht, gut. Prüf einmal, ob das Überzeugung ist oder Höflichkeit. Dein Regler beim Erklärungsmodus steht ${e<0?'trotzdem beim Täter':e===0?'in der Mitte':'ebenfalls bei „alle haben beigetragen"'}.`,
  firstUnclear:'Du hast „Unklar" gesagt. Ehrlich. Das ist oft die genaueste Antwort, denn die Frage nach dem Anfang füttert den Konflikt, sie beendet ihn nicht.',
  firstOne:x=>`Du hast gesagt: <b>${x}</b>. Eidenschink würde fragen: Henne oder Ei? Beides. Am Konflikt haben alle beigetragen, auch die, die sich rausgehalten haben. Wer einen Täter hat, wird handlungsfähig, und der Beschuldigte fühlt sich zum Zurückschlagen berechtigt. Die Frage nach dem Anfang ist Nahrung für den Konflikt.`,
  forkH:'Die Weiche',
  forkP:{caught:['Coaching','Der Konflikt hat dich: Identität, Gefühl oder Strategie hängen dran. Der Impuls gegen die Konfliktlogik muss dann aus dir kommen, nicht aus einer Gesprächstechnik. Genau dafür ist Coaching da.'],locked:['Mediation','Der Konflikt ist eingerastet, du bist aber noch handlungsfähig. Eine dritte Person kann die Kommunikation wieder unvorhersehbar machen, was ihr zu zweit gerade nicht schafft.'],self:['Selbst weitermachen','Nimm dir eine Achse vor, nicht alle. Ein Gespräch, ein Modus, eine Bewegung. Wenn es nach zwei Anläufen nicht kippt, melde dich.']},
  forkB:{caught:['Konfliktmoderation im Team','Der Konflikt hat das System: Lager, Übereinander-Reden, Abwarten. Das ist keine Sache für ein Vier-Augen-Gespräch mehr. Hier braucht es einen moderierten Rahmen mit allen Beteiligten.'],locked:['Mediation zwischen den Beteiligten','Die beiden Seiten sind eingerastet, das Umfeld noch nicht. Jetzt ist der Moment für eine klärende Mediation, bevor das System kippt.'],self:['Ein Führungsgespräch reicht vermutlich','Sprich die eine Achse an, die oben steht. Und prüfe, ob dein Raushalten Teil des Musters ist. Wer sich nicht einmischt, hat den Anfang nicht verhindert.']},
  cta:'Gespräch mit Jacob Noon anfragen',ctaUrl:'https://jacobnoon.com/coaching/',
  quote:'Nicht der Pol ist das Problem.<br>Das Einrasten ist es.',quoteSub:'Konflikte brauchen beide Pole. Wer regulieren will, braucht Kompetenzen für und gegen den Konflikt.',
  backSliders:'Zurück zu den Reglern',restart:'Neu starten',
  verdictBug:'Bug',verdictSmoulder:'Schwelbrand',verdictLop:'Schieflage',verdictFeature:'Feature',
  vBug:(n,r)=>`Der Konflikt ernährt sich selbst. Auf ${n} ist er am Widerspruchspol eingerastet: Nein erzeugt Nein, die Sache spielt kaum noch eine Rolle. Hier lohnt Beruhigen, aber nicht pauschal, sondern Achse für Achse.${r?` Gleichzeitig ist er auf ${r} am offenen Pol eingerastet, dort fehlt eher die Härte.`:''}`,
  vSmoulder:n=>`Der Konflikt wird gemieden, nicht reguliert. Auf ${n} ist er am offenen Pol eingerastet: viel Verständnis, viel Dialog, keine Entscheidung. Was hier fehlt, ist die Kompetenz <em>für</em> den Konflikt. Schüren.`,
  vLop:(n,A,B)=>`Die beiden Seiten stehen nicht im selben Konflikt. Auf ${n} liegen ${A} und ${B} weit auseinander: Eine Seite ist im Ring, die andere nicht. Eidenschink: Nur wenn zwei ebenbürtig im Ring stehen, lassen sich die Sachkonflikte besprechen. Die weiche Seite braucht Kompetenz <em>für</em> den Konflikt, die harte Seite Kompetenz <em>gegen</em> ihn.`,
  vFeature:'Der Konflikt bewegt sich noch. Er tut, wofür Konflikte da sind: eine Entscheidung zwischen Alternativen herbeiführen und eine neue Ordnung ermöglichen. Nicht lösen. Regulieren. Halte die Bewegung am Leben.',
  vMixed:'Der Konflikt ist auf beiden Seiten eingerastet: an manchen Stellen zu hart, an anderen zu weich. So kann er weder entscheiden noch beruhigen. Unten steht, wo welche Bewegung fehlt.',
  axisOf:(i,n)=>`Achse ${i} von ${n}`,qOf:(i,n)=>`Frage ${i} von ${n}`,
  pickNote:'Wähl bis zu zwei, die du mitnimmst. Nur die landen in deiner Zusammenfassung.',pick:'Nehm ich mit',picked:'Mitgenommen',
  counterH:'Was spricht dagegen?',
  counter:{
   bug:'Das Urteil sagt: festgefahren. Nenn einen Moment aus den letzten zwei Wochen, in dem sich doch etwas bewegt hat. Ein Satz, ein Zugeständnis, ein Lachen. Findest du keinen, stimmt das Urteil. Findest du einen, liegt dort dein Hebel.',
   schwel:'Das Urteil sagt: Der Konflikt wird gemieden. Nenn die letzte Entscheidung, die in dieser Sache wirklich gefallen ist. Fällt dir keine ein, stimmt das Urteil. Dann die unbequeme Frage: Wem nützt es, dass nichts entschieden wird?',
   lop:'Das Urteil sagt: Eine Seite ist im Ring, die andere nicht. Prüf, ob die weichere Seite still ist, weil sie einverstanden ist, oder weil sie sich nicht traut. Und ob du die härtere Seite härter siehst, als sie ist.',
   feature:'Das Urteil sagt: Der Konflikt bewegt sich. Prüf, ob er sich bewegt oder nur im Kreis dreht. Was ist seit seinem Beginn entschieden worden? Wenn nichts: Schau noch mal auf die Regler. Warst du freundlicher als die Lage?',
   mixed:'Das Urteil sagt: zu hart und zu weich zugleich. Welchen Teil davon würde die andere Seite unterschreiben, welchen nicht? Wo du Widerspruch erwartest, sitzt meist der blinde Fleck.'
  },
  counterPh:'Deine Antwort, optional. Bleibt im Browser und landet nur in deiner Zusammenfassung.',
  exportH:'Deine Zusammenfassung',
  exportNote:'Urteil, eingerastete Achsen, deine Karten und deine Antwort auf die Gegenfrage. Zum Mitnehmen ins nächste Gespräch oder ins Erstgespräch mit Jacob. Nichts davon verlässt deinen Browser, bis du es selbst weitergibst.',
  copy:'Ergebnis kopieren',pdf:'Als PDF speichern',copied:'Kopiert. Du kannst es jetzt einfügen.',copyFail:'Kopieren ging nicht automatisch. Der Text ist markiert, kopier ihn mit Strg+C bzw. Cmd+C.',
  sumTitle:'Konflikt-Check: Zusammenfassung',sumPersp:'Perspektive',sumVerdict:'Urteil',sumLocked:'Eingerastet',sumTend:'Tendenz',sumNone:'keine Achse',
  sumMoves:'Meine Bewegungen',sumMovesAll:'Vorgeschlagene Bewegungen (keine ausgewählt)',sumAns:'Meine Antwort:',sumFork:'Empfehlung',
  sumSource:'Erstellt mit dem Konflikt-Check auf jacobnoon.com/konflikt-check/. Grundlage: Klaus Eidenschink, „Die Kunst des Konflikts". Keine Diagnose.'
 }
},
en:{
 axes:[
 {id:'auf',dim:'sache',name:'Attention',left:'generalised',right:'specific',
  q:{partei:"What's it about right now? Still the one concrete thing, or by now 'always', 'never' and 'in principle'?",beob:'Is this side still arguing about the concrete point, or has everything become the topic?'},
  lp:'The molehill has become a mountain',rp:"It's about exactly one thing",
  down:'Move attention from the general back to the specific. Where exactly is the difference? Where have you long agreed? Narrow down what divides you, name what you share.',
  up:'If only the individual case ever gets discussed, that can be a way of playing it down. Name the mountain behind the molehill: what is this actually about?',
  sdown:'Getting specific: narrowing down the dividing line, making common ground visible.',sup:'Being allowed to generalise: saying out loud the pattern behind the single case.'},
 {id:'bes',dim:'sache',name:'Description',left:'single-minded',right:'many-sided',
  q:{partei:'From where you stand, is there exactly one right solution, or could you let several views stand?',beob:'Does this side allow several views of problem and solution, or does only one count?'},
  lp:"There's one right view: mine",rp:'There are several workable views',
  down:'The situation is many-sided, the views are single-minded. Bring in more perspectives: experts, the people affected, the view from the whole rather than from your own patch.',
  up:"Endless weighing-up is a way of getting stuck too. If there's pressure to agree (what? when? who?), single-mindedness is needed: a frame, a deadline, a decision. A compromise is allowed to be imperfect on the substance.",
  sdown:'Perspective-taking: seeing other views as workable.',sup:'Decisiveness: limiting the variety and settling.'},
 {id:'bew',dim:'sache',name:'Evaluation',left:'absolute',right:'open',
  q:{partei:'How sure are you that the other side is wrong?',beob:"Does this side argue in right and wrong, good and bad, or can it leave open who's right in the end?"},
  lp:"I'm right. Full stop.",rp:'Both of us could be right',
  down:'Whoever contradicts the judgement here contradicts the person. Movement only becomes possible once the threatened identity finds a footing elsewhere: recognition first, then loosen the judgement.',
  up:"Without agreement on what's good and right, the conflict keeps smouldering. At some point someone has to say what counts. Positions need force and clarity too.",
  sdown:"Mentalising and tolerance of ambiguity: seeing the world through the other's eyes and bearing not knowing.",sup:'Taking a stand: charging judgements with resolve.'},
 {id:'kon',dim:'sozial',name:'Contact',left:'hostile',right:'dialogic',
  q:{partei:'Do you still expect anything good from the other side?',beob:'Does this side assume the other is acting on purpose, or does it still credit them with decent motives?'},
  lp:"They're out to hurt me",rp:'They have reasons I could understand',
  down:'The enemy legitimises the aggression, the aggression creates the enemy. Test your assumptions: what motives could the other side have that have nothing to do with you?',
  up:'Someone who only ever offers dialogue often never gets to the point. The conflict smoulders. Here somebody is allowed to step into the ring and speak plainly, even if it comes across as unfriendly.',
  sdown:'Testing assumptions, exploring motives.',sup:'Courage to speak plainly: bearing being the opponent.'},
 {id:'rea',dim:'sozial',name:'Reaction',left:'negating',right:'choosing',
  q:{partei:"If the other side suggests something tomorrow, do you already know you'll say no?",beob:'Does this side say no to everything on reflex, or does it still choose what to react to and how?'},
  lp:'No. Whatever it is.',rp:'Depends what it is',

 {id:'akt',dim:'sozial',name:'Action',left:'broadcasting',right:'exploring',

 {id:'erk',dim:'zeit',name:'Explanation',left:'linear',right:'circular',

  asymH:'Asymmetry',asym:(n,list,A,B)=>`On ${n} (${list}) ${A} and ${B} are three or more steps apart. That's no accident, it's often the pattern itself: the harder side escalates because it isn't being taken seriously. The softer side keeps the conflict alive because nothing gets decided. Both need to move, in opposite directions.`,

  forkH:'The fork in the road',
  forkP:{caught:['Coaching',"The conflict has you: identity, feeling or strategy are tied up in it. The impulse against the logic of the conflict then has to come from you, not from a conversation technique. That's exactly what coaching is for."],locked:['Mediation',"The conflict is locked, but you can still act. A third person can make the communication unpredictable again, which is what the two of you can't manage right now."],self:['Carry on yourself',"Take on one axis, not all of them. One conversation, one mode, one movement. If it hasn't tipped after two attempts, get in touch."]},

  cta:'Request a conversation with Jacob Noon',ctaUrl:'https://jacobnoon.com/en/coaching/',
  quote:'Not the pole is the problem.<br>Getting stuck is.',quoteSub:'Conflicts need both poles. Regulating them takes competence for and against conflict.',

const D=DATA[L], AXES=D.axes, DIMS=D.dims, ERG=D.erg, STEPNAMES=D.steps, U=D.ui;

const S={role:null,start:null,pos:{},oth:{},fix:{},erg:{},names:{a:D.sideA,b:D.sideB}};
AXES.forEach(a=>{S.pos[a.id]=0;S.oth[a.id]=0;S.fix[a.id]=null});
let step=0;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function starts(){if(S.role==='partei')return D.startsPartei;return [['a',S.names.a],['b',S.names.b],['beide',D.both],['unklar',D.unclear]]}

/* static texts */
(function(){
  document.title=U.docTitle;
  $('#t-title').innerHTML=U.title;
  ['lead','roleq','r1','r1s','r2','r2s','note','s1e','s1h','s1l','names','namesnote','d1e','d1h','d1l','d2e','d2h','d3e','d3h','foot'].forEach(k=>$('#t-'+k).textContent=U[k]);
  $('#crumb').textContent=U.crumb;$('#startBtn').textContent=U.go;$('#resultBtn').textContent=U.result;
  $$('[data-back]').forEach(b=>b.textContent=U.back);$$('[data-next]').forEach(b=>b.textContent=U.next);
  $('#nameA').placeholder=U.nameA;$('#nameB').placeholder=U.nameB;
  $('#stepname').textContent=STEPNAMES[0];
})();

function show(n){
  step=n;
  $$('.screen').forEach(s=>s.classList.toggle('on',+s.dataset.step===n));
  $('#bar').style.width=(n/6*100)+'%';
  $('#stepname').textContent=STEPNAMES[n];
  $('#stepnum').textContent=n===0?'':`${n} / 6`;
  $('#crumb').textContent=S.role?(S.role==='partei'?U.crumbP:U.crumbB):U.crumb;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* start */
$$('#roleChoices .choice').forEach(b=>b.addEventListener('click',()=>{
  S.role=b.dataset.role;
  $$('#roleChoices .choice').forEach(x=>x.classList.toggle('sel',x===b));
  $('#startBtn').disabled=false;
}));
$('#startBtn').addEventListener('click',()=>{buildAll();show(1)});
['A','B'].forEach(k=>$('#name'+k).addEventListener('input',e=>{S.names[k.toLowerCase()]=e.target.value.trim()||(k==='A'?D.sideA:D.sideB);const bs=$$('#startChoices .choice');if(bs.length){bs[k==='A'?0:1].querySelector('b').textContent=S.names[k.toLowerCase()]}}));

function buildAll(){
  const r=S.role;
  const sc=$('#startChoices');sc.innerHTML='';
  $('#nameBox').hidden=r!=='beob';
  starts().forEach(([k,l])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${esc(l)}</b>`;b.onclick=()=>{S.start=k;$$('#startChoices .choice').forEach(x=>x.classList.toggle('sel',x===b));sc.closest('.screen').querySelector('[data-next]').disabled=false};sc.appendChild(b)});
  ['sache','sozial','zeit'].forEach(d=>{const box=$('#dim-'+d);box.innerHTML='';AXES.filter(a=>a.dim===d).forEach(a=>box.appendChild(axisEl(a)))});
  $('#ergTitle').textContent=r==='partei'?U.ergP:U.ergB;
  $('#ergEyebrow').textContent=r==='partei'?U.ergPe:U.ergBe;
  const e=$('#erg');e.innerHTML='';
  ERG[r].forEach((it,i)=>{const w=document.createElement('div');w.className='axis';w.innerHTML=`<p class="count">${U.qOf(i+1,ERG[r].length)}</p><p class="q">${esc(it.q)}</p><div class="choices"></div>`;const c=w.querySelector('.choices');it.o.forEach((o,v)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span style="color:var(--ink);font-size:15px">${esc(o)}</span>`;b.onclick=()=>{S.erg[i]=v;c.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',x===b));$('#resultBtn').disabled=Object.keys(S.erg).length<ERG[r].length};c.appendChild(b)});e.appendChild(w)});
}
function axisEl(a){
  const w=document.createElement('div');w.className='axis';
  const P=S.role==='partei';
  const other=P?`<div class="other-row"><label for="o-${a.id}">${U.other}</label><div class="sl"><input class="other" type="range" id="o-${a.id}" min="-3" max="3" step="1" value="0"></div></div>`:'';
  const sliders=P?`<div class="sl"><input type="range" id="p-${a.id}" min="-3" max="3" step="1" value="0" aria-label="${a.name}: ${a.left} / ${a.right}"></div>`
   :`<div class="side-row"><label><span class="dot-a"></span>${esc(S.names.a)}</label><div class="sl"><input type="range" id="p-${a.id}" min="-3" max="3" step="1" value="0" aria-label="${esc(S.names.a)}, ${a.name}"></div></div>
     <div class="side-row"><label><span class="dot-b"></span>${esc(S.names.b)}</label><div class="sl"><input class="other b" type="range" id="o-${a.id}" min="-3" max="3" step="1" value="0" aria-label="${esc(S.names.b)}, ${a.name}"></div></div>`;
  w.innerHTML=`<div class="name"><span class="os">${D.mode(a.name)}</span><span class="count">${U.axisOf(AXES.indexOf(a)+1,AXES.length)}</span></div>
  <p class="q">${esc(a.q[S.role])}</p>
  ${P?'':'<div class="poles" style="margin:0 0 -4px"><span><b>'+a.left+'</b></span><span><b>'+a.right+'</b></span></div>'}
  ${sliders}
  <div class="poles"><span>${P?'<b>'+a.left+'</b>':''}${esc(a.lp)}</span><span>${P?'<b>'+a.right+'</b>':''}${esc(a.rp)}</span></div>
  <div class="sub"><label>${U.fixq}</label><div class="seg" data-ax="${a.id}"><button data-v="0">${U.fix0}</button><button data-v="2">${U.fix2}</button></div></div>
  ${other}`;
  w.querySelector('#p-'+a.id).oninput=e=>S.pos[a.id]=+e.target.value;
  w.querySelector('#o-'+a.id).oninput=e=>S.oth[a.id]=+e.target.value;
  w.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.fix[a.id]=+b.dataset.v;w.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('sel',x===b))});
  return w;
}

/* nav */
$$('[data-next]').forEach(b=>b.addEventListener('click',()=>{
  if(step>=2&&step<=4){const d=['sache','sozial','zeit'][step-2];const miss=AXES.filter(a=>a.dim===d&&S.fix[a.id]===null);if(miss.length){const el=$('#dim-'+d).querySelector(`.seg[data-ax="${miss[0].id}"]`);el.style.outline='2px solid var(--orange)';el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>el.style.outline='',1600);return}}
  if(step===1&&S.role==='beob'){$$('.side-row').forEach((row,i)=>{row.querySelector('label').lastChild.textContent=i%2?S.names.b:S.names.a})}
  show(step+1)}));
$$('[data-back]').forEach(b=>b.addEventListener('click',()=>show(step-1)));
$('#resultBtn').addEventListener('click',()=>{render();show(6)});

/* logic */
function stat(p,f){f=f||0;if(f===2&&Math.abs(p)>=2)return 'fix';if(Math.abs(p)>=2)return 'tend';return 'ok'}
function status(a){return stat(S.pos[a.id],S.fix[a.id])}
function statusB(a){return stat(S.oth[a.id],S.fix[a.id])}
function render(){
  const r=S.role,P=r==='partei';
  const st={},stB={};AXES.forEach(a=>{st[a.id]=status(a);stB[a.id]=P?'ok':statusB(a)});
  const fixL=a=>(st[a.id]==='fix'&&S.pos[a.id]<0)||(stB[a.id]==='fix'&&S.oth[a.id]<0);
  const fixR=a=>(st[a.id]==='fix'&&S.pos[a.id]>0)||(stB[a.id]==='fix'&&S.oth[a.id]>0);
  const Lx=AXES.filter(fixL), R=AXES.filter(fixR);
  const E=Object.values(S.erg).reduce((s,v)=>s+v,0); const caught=E>=5;
  const gaps=AXES.filter(a=>Math.abs(S.pos[a.id]-S.oth[a.id])>=3);
  const NA=esc(S.names.a),NB=esc(S.names.b);
  let cls,title,text,vk;
  if(!P&&gaps.length>=3&&Lx.length<3){cls='schwel';vk='lop';title=U.verdictLop;text=U.vLop(U.axesN(gaps.length),NA,NB)}
  else if(Lx.length>=3||(Lx.length>=2&&caught)||(Lx.length>=2&&Lx.length>R.length)){cls='bug';vk='bug';title=U.verdictBug;text=U.vBug(U.axesN(Lx.length),R.length?U.axesN(R.length):'')}
  else if(R.length>=2&&R.length>=Lx.length){cls='schwel';vk='schwel';title=U.verdictSmoulder;text=U.vSmoulder(U.axesN(R.length))}
  else if(Lx.length+R.length<=1){cls='';vk='feature';title=U.verdictFeature;text=U.vFeature}
  else {cls='bug';vk='mixed';title=U.verdictBug;text=U.vMixed}
  let h='';
  h+=`<div><p class="eyebrow">${U.yourResult}</p><div class="verdict ${cls}" style="margin-top:10px"><h2>${title}</h2><p>${text}</p>${caught?`<p style="margin-top:6px"><span class="pill fix">${P?U.hasYou:U.hasSystem}</span></p>`:''}</div></div>`;
  const counterQ=U.counter[vk];
  h+=`<div class="callout counter"><p class="eyebrow">${U.counterH}</p><p>${counterQ}</p><textarea class="ta" id="counterAns" rows="3" placeholder="${U.counterPh}" aria-label="${U.counterH}"></textarea></div>`;
  /* profile */
  h+=`<div><p class="eyebrow">${U.profile}</p><p class="muted" style="font-size:14px;margin-top:4px">${U.profileNote}</p>`;
  ['sache','sozial','zeit'].forEach(d=>{h+=`<div class="dim"><h3>${DIMS[d]}</h3>`;AXES.filter(a=>a.dim===d).forEach(a=>{const s=st[a.id],sb=stB[a.id];const x=(S.pos[a.id]+3)/6*100,xo=(S.oth[a.id]+3)/6*100;
    let pills='';
    if(P){pills=(s==='fix'?`<span class="pill fix">${U.locked}</span> `:s==='tend'?`<span class="pill tend">${U.tend}</span> `:'')+(gaps.includes(a)?`<span class="pill gap">${U.seeDiff}</span>`:'')}
    else{pills=(s==='fix'?`<span class="pill fix">${NA} ${U.locked}</span> `:s==='tend'?`<span class="pill tend">${NA}: ${U.tend}</span> `:'')+(sb==='fix'?`<span class="pill fix">${NB} ${U.locked}</span> `:sb==='tend'?`<span class="pill tend">${NB}: ${U.tend}</span> `:'')+(gaps.includes(a)?`<span class="pill gap">${U.lopsided}</span>`:'')}
    const dots=P?`<i class="dot o" style="left:${xo}%" title="${U.otherView}"></i><i class="dot ${s==='ok'?'':s}" style="left:${x}%"></i>`
      :`<i class="dot b ${sb==='fix'?'ring':''}" style="left:${xo}%" title="${NB}"></i><i class="dot a ${s==='fix'?'ring':''}" style="left:${x}%" title="${NA}"></i>`;
    h+=`<div class="row"><div class="l"><b>${a.name}</b>${a.left}</div><div class="track">${dots}</div><div class="r"><b>&nbsp;</b>${a.right}</div>${pills?`<div class="pills">${pills}</div>`:''}</div>`});h+='</div>'});
  h+=P?`<div class="legend"><span><i style="background:var(--green)"></i>${U.legMoving}</span><span><i style="background:var(--gold)"></i>${U.legTend}</span><span><i style="background:var(--orange)"></i>${U.legLocked}</span><span><i style="background:var(--card);box-shadow:0 0 0 2px var(--blue)"></i>${U.legOther}</span></div></div>`
      :`<div class="legend"><span><i style="background:var(--green)"></i>${NA}</span><span><i style="background:var(--blue)"></i>${NB}</span><span><i style="background:var(--card);box-shadow:0 0 0 2px var(--orange)"></i>${U.legLocked}</span></div></div>`;
  /* moves */
  let items=[];
  AXES.forEach(a=>{items.push({a,side:'a',p:S.pos[a.id],s:st[a.id]});if(!P)items.push({a,side:'b',p:S.oth[a.id],s:stB[a.id]})});
  const fixed=items.filter(i=>i.s==='fix'), tend=items.filter(i=>i.s==='tend');
  fixed.sort((x,y)=>Math.abs(y.p)-Math.abs(x.p));
  const MAX=5, list=fixed.length?fixed.slice(0,MAX):tend.slice(0,2);
  const lk=[],td=[],pole=(a,p)=>p<0?a.left:a.right;
  AXES.forEach(a=>{
    const pa=P?'':S.names.a+': ';
    if(st[a.id]==='fix')lk.push(pa+a.name+' ('+pole(a,S.pos[a.id])+')');else if(st[a.id]==='tend')td.push(pa+a.name+' ('+pole(a,S.pos[a.id])+')');
    if(!P){const pb=S.names.b+': ';if(stB[a.id]==='fix')lk.push(pb+a.name+' ('+pole(a,S.oth[a.id])+')');else if(stB[a.id]==='tend')td.push(pb+a.name+' ('+pole(a,S.oth[a.id])+')')}
  });
  const mv=list.map(({a,side,p})=>{const dn=p<0;return {tag:(P?'':(side==='a'?S.names.a:S.names.b)+' · ')+(dn?U.calm:U.stir)+' · '+D.mode(a.name)+': '+(dn?U.fromTo(a.left,a.right):U.fromTo(a.right,a.left)),skill:dn?a.sdown:a.sup}});
  if(list.length){
    h+=`<div><p class="eyebrow">${U.movesH}</p><p class="muted" style="font-size:14px;margin-top:4px">${fixed.length>MAX?U.movesMany(fixed.length,MAX):fixed.length?U.movesFixed:U.movesTend}${P?'':U.movesBeob} ${U.pickNote}</p><div class="moves">`;
    list.forEach(({a,side,p},idx)=>{const dn=p<0;const who=P?'':(side==='a'?NA:NB)+' · ';h+=`<div class="move ${dn?'':'up'}"><span class="tag">${who}${dn?U.calm:U.stir} · ${D.mode(a.name)}: ${dn?U.fromTo(a.left,a.right):U.fromTo(a.right,a.left)}</span><p>${esc(dn?a.down:a.up)}</p><p class="skill"><b>${U.skill}</b> ${esc(dn?a.sdown:a.sup)}</p><button class="pick" type="button" aria-pressed="false" data-i="${idx}">${U.pick}</button></div>`});
    h+='</div></div>';
  } else {
    h+=`<div class="callout"><p class="eyebrow">${U.movesH}</p><p>${U.noFix}</p></div>`;
  }
  if(gaps.length){const names=gaps.map(a=>a.name).join(', ');h+=`<div class="callout" style="background:var(--blue-tint);border-left-color:var(--blue)"><p class="eyebrow" style="color:var(--blue)">${P?U.gapH:U.asymH}</p><p>${P?U.gap(U.axesN(gaps.length),names):U.asym(U.axesN(gaps.length),names,NA,NB)}</p></div>`}
  /* first question */
  const erk=S.pos['erk'];
  let an=S.start==='beide'?U.firstBoth(erk):S.start==='unklar'?U.firstUnclear:U.firstOne(esc(starts().find(x=>x[0]===S.start)[1]));
  h+=`<div class="callout"><p class="eyebrow">${U.firstH}</p><p>${an}</p></div>`;
  /* fork */
  const F=P?U.forkP:U.forkB;const [wt,wp]=caught?F.caught:Lx.length>=2?F.locked:F.self;
  h+=`<div class="callout ink"><p class="eyebrow">${U.forkH}</p><h3 style="font-size:24px">${wt}</h3><p>${wp}</p><p style="margin-top:8px"><a href="${U.ctaUrl}" target="_blank" rel="noopener">${U.cta}</a></p></div>`;
  h+=`<div class="callout export"><p class="eyebrow">${U.exportH}</p><p>${U.exportNote}</p><div class="export-btns"><button class="btn primary" type="button" id="copyBtn">${U.copy}</button><button class="btn ghost" type="button" id="pdfBtn">${U.pdf}</button></div><p class="toast" id="copyMsg" aria-live="polite"></p><textarea class="ta" id="copyFallback" rows="8" readonly hidden></textarea></div>`;
  h+=`<div><p class="quote">${U.quote}</p><p class="muted" style="font-size:14px">${U.quoteSub}</p></div>`;
  h+=`<div class="nav"><button class="btn ghost" data-back2>${U.backSliders}</button><button class="btn" onclick="location.reload()">${U.restart}</button></div>`;
  $('#result').innerHTML=h;
  $('[data-back2]').onclick=()=>show(5);
  RES={title,text:plain(text),caught,locked:lk,tend:td,moves:mv,picks:[],counterQ:plain(counterQ),fork:[plain(wt),plain(wp)]};
  $$('#result .pick').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,k=RES.picks.indexOf(i);
    if(k>-1)RES.picks.splice(k,1);else if(RES.picks.length<2)RES.picks.push(i);
    $$('#result .pick').forEach(x=>{const on=RES.picks.includes(+x.dataset.i);x.setAttribute('aria-pressed',on);x.textContent=on?U.picked:U.pick;x.closest('.move').classList.toggle('picked',on);x.disabled=!on&&RES.picks.length>=2});
  });
  $('#copyBtn').onclick=copySum;
  $('#pdfBtn').onclick=printSum;
}

/* summary: copy and print, nothing leaves the browser */
let RES=null;
function plain(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent.trim()}
function sumMeta(){return new Date().toLocaleDateString(L==='en'?'en-GB':'de-DE',{day:'numeric',month:'long',year:'numeric'})+' · '+U.sumPersp+': '+(S.role==='partei'?U.r1:U.r2)}
function summary(){
  const R=RES,picked=R.moves.filter((m,i)=>R.picks.includes(i));
  const ans=(($('#counterAns')||{}).value||'').trim();
  const sec=[];
  sec.push({h:U.sumVerdict,l:[R.title+(R.caught?' · '+(S.role==='partei'?U.hasYou:U.hasSystem):''),R.text]});
  sec.push({h:U.sumLocked,l:R.locked.length?R.locked:[U.sumNone]});
  if(R.tend.length)sec.push({h:U.sumTend,l:R.tend});
  if(R.moves.length){const m=picked.length?picked:R.moves;sec.push({h:picked.length?U.sumMoves:U.sumMovesAll,l:m.map(x=>x.tag+'\n'+U.skill+' '+x.skill)})}
  sec.push({h:U.counterH,l:[R.counterQ].concat(ans?[U.sumAns+' '+ans]:[])});
  sec.push({h:U.sumFork,l:[R.fork[0]+': '+R.fork[1]]});
  return sec;
}
function sumText(){
  let t=U.sumTitle+'\n'+sumMeta()+'\n';
  summary().forEach(x=>{t+='\n'+x.h.toUpperCase()+'\n'+x.l.map(y=>'- '+y.replace(/\n/g,'\n  ')).join('\n')+'\n'});
  return t+'\n'+U.sumSource;
}
function copySum(){
  const t=sumText(),msg=$('#copyMsg'),ta=$('#copyFallback');
  const ok=()=>{ta.hidden=true;msg.textContent=U.copied};
  const fb=()=>{ta.hidden=false;ta.value=t;ta.focus();ta.select();msg.textContent=U.copyFail};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
}
function printSum(){
  let h=`<h1>${esc(U.sumTitle)}</h1><p class="m">${esc(sumMeta())}</p>`;
  summary().forEach(x=>{h+=`<h2>${esc(x.h)}</h2><ul>${x.l.map(y=>`<li>${esc(y).replace(/\n/g,'<br>')}</li>`).join('')}</ul>`});
  h+=`<p class="m" style="margin-top:18px">${esc(U.sumSource)}</p>`;
  $('#printSheet').innerHTML=h;
  window.print();
}

/* iframe integration: report height and step changes to the parent page */
(function(){
  function report(){try{parent.postMessage({jnApp:'height',h:document.documentElement.scrollHeight},'*')}catch(e){}}
  var ro=window.ResizeObserver?new ResizeObserver(report):null;
  if(ro)ro.observe(document.body);
  window.addEventListener('load',report);
  var _show=show;show=function(n){_show(n);try{parent.postMessage({jnApp:'top'},'*')}catch(e){};setTimeout(report,50)};
})();
</script>
