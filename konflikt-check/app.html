<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bug oder Feature?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  --green:#4CC265; --green-deep:#2E9A48; --green-tint:#E9F8EC;
  --blue:#3B82C4; --blue-tint:#E7F0FA;
  --orange:#D9552B; --orange-tint:#FBECE6;
  --gold:#E6A817; --gold-tint:#FCF3DC;
  --ink:#111114; --ink-2:#3E4441; --ink-3:#6B7370;
  --line:#DCE3DE; --line-soft:#ECF0ED;
  --bg:#F9FAFB; --card:#FFFFFF; --track:#EDF1EE;
  --shadow:0 1px 2px rgba(17,17,20,.06), 0 8px 24px rgba(17,17,20,.06);
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green-deep:#6BD883; --green-tint:#17301D;
    --blue-tint:#15263A; --orange-tint:#3A1D14; --gold-tint:#3A2C0E;
    --ink:#F4F6F4; --ink-2:#C9CFCB; --ink-3:#8F9994;
    --line:#2C332F; --line-soft:#232926;
    --bg:#111114; --card:#1A1D1B; --track:#262B28;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --logo-light:none; --logo-dark:block;
  }
}
:root[data-theme="dark"]{
  --green-deep:#6BD883; --green-tint:#17301D;
  --blue-tint:#15263A; --orange-tint:#3A1D14; --gold-tint:#3A2C0E;
  --ink:#F4F6F4; --ink-2:#C9CFCB; --ink-3:#8F9994;
  --line:#2C332F; --line-soft:#232926;
  --bg:#111114; --card:#1A1D1B; --track:#262B28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --logo-light:none; --logo-dark:block;
}
*{box-sizing:border-box}
body.embedded{background:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.os{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:500;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,8vw,64px);line-height:.98;text-transform:uppercase}
h2{font-size:clamp(26px,4.5vw,34px);line-height:1.1;text-transform:uppercase}
h3{font-size:20px;line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
a{color:var(--green-deep)}
.eyebrow{font-family:"DM Sans";font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
.muted{color:var(--ink-3)}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 40px}
body.embedded .wrap{padding:0 0 8px}
.frame{background:var(--card);border-top:3px solid var(--green);border-bottom:3px solid var(--green);box-shadow:var(--shadow);position:relative}
.frame::after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--green);opacity:.55}
.frame::before{content:"";position:absolute;left:0;right:0;bottom:9px;height:1px;background:var(--green);opacity:.55}
.head{display:flex;justify-content:space-between;align-items:center;padding:26px 32px 0}
.logo{display:block;line-height:0}
.logo img{height:36px;width:auto}
.logo .logo-light{display:var(--logo-light,block)}
.logo .logo-dark{display:var(--logo-dark,none)}
.progress{height:3px;background:var(--track);margin:18px 32px 0;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .35s ease}
.stepline{display:flex;justify-content:space-between;padding:8px 32px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.screen{display:none;padding:28px 32px 36px}
.screen.on{display:block}
@media (max-width:560px){.head,.progress,.stepline,.screen{padding-left:18px;padding-right:18px}.progress{margin-left:18px;margin-right:18px}}
.lead{font-size:18px;color:var(--ink-2);max-width:60ch}
.stack{display:grid;gap:22px}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;cursor:pointer;padding:13px 22px;background:var(--ink);color:var(--bg);letter-spacing:.02em;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.choice:focus-visible,.seg button:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--green);color:#0B1F10}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);padding:11px 18px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line-soft)}
.choices{display:grid;gap:10px}
.choice{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);padding:16px 18px;color:var(--ink);display:grid;gap:3px;transition:border-color .15s,background .15s}
.choice b{font-family:Oswald;font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.choice span{color:var(--ink-3);font-size:14px}
.choice:hover{border-color:var(--green)}
.choice.sel{border-color:var(--green);background:var(--green-tint)}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.choices.row .choice{padding:14px 14px}
.choices.row .choice b{font-size:17px}
.names{display:grid;gap:8px}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namegrid label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);padding:0 12px;background:var(--card)}
.namegrid input{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:12px 0;width:100%;min-width:0}
.namegrid input:focus{outline:none}
.namegrid label:focus-within{border-color:var(--green)}
.dot-a,.dot-b{flex:none;width:12px;height:12px;border-radius:50%;background:var(--green)}
.dot-b{background:var(--blue)}
@media (max-width:560px){.namegrid{grid-template-columns:1fr}}
.side-row{display:grid;gap:2px;margin-top:10px}
.side-row label{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;font-weight:500}
/* axis block */
.axis{border-top:1px solid var(--line-soft);padding-top:22px}
.axis:first-child{border-top:0;padding-top:0}
.axis .q{font-size:18px;font-weight:500;max-width:62ch;margin:4px 0 14px}
.axis .name{display:flex;align-items:baseline;gap:10px}
.axis .name .os{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.poles{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-3);margin-top:6px}
.poles span{max-width:45%}
.poles span:last-child{text-align:right}
.poles b{display:block;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:1px}
.sl{position:relative;height:34px;display:flex;align-items:center}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--track);border-radius:3px}
.sl::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;margin-left:-1px;background:var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;position:relative;z-index:1;height:34px}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:transparent}
input[type=range]::-moz-range-track{height:6px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--green);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--green);margin-top:-9px;cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--green);cursor:grab}
input[type=range].other::-webkit-slider-thumb{background:var(--card);box-shadow:0 0 0 2.5px var(--blue)}
input[type=range].other::-moz-range-thumb{background:var(--card);box-shadow:0 0 0 2.5px var(--blue)}
input[type=range].b::-webkit-slider-thumb{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
input[type=range].b::-moz-range-thumb{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue)}
.sub{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:14px}
.sub label{font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;border:1.5px solid var(--line)}
.seg button{font:inherit;font-size:13px;font-weight:500;background:transparent;border:0;border-left:1.5px solid var(--line);padding:7px 12px;cursor:pointer;color:var(--ink-2)}
.seg button:first-child{border-left:0}
.seg button.sel{background:var(--ink);color:var(--bg)}
.other-row{margin-top:12px;padding:12px 14px;background:var(--blue-tint);display:grid;gap:4px}
.other-row label{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.other-row label::before{content:"";width:10px;height:10px;border-radius:50%;border:2.5px solid var(--blue);background:var(--card)}
@media (max-width:560px){.sub{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1}}
/* result */
.verdict{display:grid;gap:8px;padding:22px 24px;border-left:6px solid var(--gold);background:var(--gold-tint)}
.verdict.bug{border-color:var(--orange);background:var(--orange-tint)}
.verdict.schwel{border-color:var(--blue);background:var(--blue-tint)}
.verdict h2{font-size:clamp(34px,6vw,48px)}
.verdict p{max-width:62ch}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--track);color:var(--ink-2);vertical-align:middle}
.pill.fix{background:var(--orange);color:#fff}
.pill.tend{background:var(--gold-tint);color:#7A5300}
.pill.gap{background:var(--blue-tint);color:var(--blue)}
.dim{margin-top:22px}
.dim h3{color:var(--ink-3);font-size:13px;letter-spacing:.14em;padding-bottom:8px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.row .l,.row .r{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);line-height:1.3}
.row .r{text-align:right}
.row .l b,.row .r b{display:block;font-family:Oswald;font-weight:500;font-size:14px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
.row .pills{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.track{position:relative;height:28px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--track);border-radius:3px}
.track::after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;background:var(--line)}
.dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--green);border:2.5px solid var(--card);box-shadow:0 0 0 1.5px var(--green);z-index:2}
.dot.fix{background:var(--orange);box-shadow:0 0 0 1.5px var(--orange)}
.dot.tend{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.dot.o{background:var(--card);box-shadow:0 0 0 2.5px var(--blue);width:12px;height:12px;margin:-6px 0 0 -6px;z-index:1}
.dot.b{background:var(--blue);box-shadow:0 0 0 1.5px var(--blue);z-index:1}
.dot.ring{box-shadow:0 0 0 3px var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.row{grid-template-columns:1fr 1fr;gap:4px 12px}.row .r{text-align:right}.row .track{order:-1;grid-column:1/-1}.row .r b{display:none}}
.moves{display:grid;gap:14px;margin-top:10px}
.move{padding:18px 20px;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--orange);display:grid;gap:8px}
.move.up{border-left-color:var(--blue)}
.move .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.move.up .tag{color:var(--blue)}
.move .skill{font-size:14px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.move .skill b{font-weight:700;color:var(--ink)}
.move .reflect{font-size:14px;color:var(--ink-2);font-style:italic}
.move .alt{font-size:14px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.move .alt b{font-weight:700;color:var(--ink)}
.move .altq{font-size:13px;font-weight:700;color:var(--ink)}
.move .picks{display:flex;flex-wrap:wrap;gap:8px}
.move .reflect b{font-style:normal;font-weight:700;color:var(--ink)}
.callout.func{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--gold)}
.callout.func .ex{font-size:13px;color:var(--ink-3)}
.callout.cost{background:var(--gold-tint);border-left-color:var(--gold)}
.callout.prep{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--green)}
.callout.prep .picks{display:flex;flex-wrap:wrap;gap:8px}
.callout.prep .pick{font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:8px 14px}
.callout.prep .pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callout.prep .fl{display:block;font-size:14px;font-weight:700;margin-top:12px}
.callout.prep .ta{min-height:0;margin-top:4px}
.callout.prep .seg{margin-top:4px}
.eat{display:grid;gap:8px;margin-top:6px}
.eat .step{display:grid;gap:2px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.eat .step b{font-family:Oswald;font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.eat .step em{color:var(--ink-2)}
.callout{padding:18px 20px;background:var(--green-tint);border-left:5px solid var(--green);display:grid;gap:6px}
.callout.ink{background:var(--ink);color:var(--bg);border-left-color:var(--green)}
.callout.ink .eyebrow{color:var(--green)}
.callout.ink a{color:var(--green)}
.quote{font-family:Oswald;font-size:clamp(22px,4vw,30px);line-height:1.15;text-transform:uppercase;font-weight:500;margin:6px 0}
.foot{font-size:12px;color:var(--ink-3);padding:18px 32px 26px;max-width:60ch}
.demo{font-size:13px;color:var(--ink-3);border:1px dashed var(--line);padding:10px 12px}
.count{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.axis .name .count{margin-left:auto}
.move .pick{justify-self:start;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:transparent;border:1.5px solid var(--line);color:var(--ink-2);padding:6px 12px;margin-top:4px}
.move .pick:hover{border-color:var(--green)}
.move .pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.move .pick[disabled]{opacity:.4;cursor:not-allowed}
.move .pick:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.move.picked{box-shadow:0 0 0 2px var(--green)}
.ta{font:inherit;font-size:15px;width:100%;min-height:84px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;resize:vertical;margin-top:6px}
.ta:focus{outline:none;border-color:var(--green)}
.callout.counter{background:var(--orange-tint);border-left-color:var(--orange)}
.callout.counter .eyebrow{color:var(--ink-2)}
.callout.export{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--green)}
.export-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.toast{font-size:13px;color:var(--green-deep);min-height:1em}
#printSheet{display:none}
@media print{
  @page{margin:18mm}
  body{background:#fff!important;color:#111114}
  .wrap{display:none!important}
  #printSheet{display:block!important;font-family:"DM Sans",Arial,sans-serif;font-size:11pt;line-height:1.5;color:#111114}
  #printSheet h1{font-family:Oswald,Arial,sans-serif;font-weight:500;text-transform:uppercase;font-size:22pt;border-bottom:3px solid #4CC265;padding-bottom:6px;margin:0 0 6px}
  #printSheet h2{font-family:Oswald,Arial,sans-serif;font-weight:500;text-transform:uppercase;font-size:12pt;letter-spacing:.06em;color:#2E9A48;margin:16px 0 4px}
  #printSheet ul{margin:0;padding-left:18px}
  #printSheet li{margin:3px 0;break-inside:avoid}
  #printSheet .m{color:#6B7370;font-size:9.5pt;margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  q:{partei:'Worum geht es gerade? Noch um die eine konkrete Sache, oder inzwischen um „immer", „nie" und „grundsätzlich"?',beob:'Streitet diese Seite noch über den konkreten Punkt, oder ist für sie längst alles Thema?'},
  lp:'Aus der Mücke ist ein Elefant geworden',rp:'Es geht um genau einen Punkt',
  down:'Verlagere die Aufmerksamkeit vom Generellen zum Spezifischen. Wo genau liegt der Unterschied? Wo seid ihr euch längst einig? Das Trennende eingrenzen, das Gemeinsame benennen.',
  up:'Wenn immer nur der Einzelfall besprochen wird, kann das Bagatellisierung sein. Den Elefanten hinter der Mücke benennen: Worum geht es hier eigentlich?',
  sdown:"Spezifisch bleiben: Widerspruch in der Sache und Ablehnung der Person auseinanderhalten. Gefühle einklammern, nicht wegdrücken. Dein Selbstwert hängt nicht am Rechtbekommen.",rdown:"Bei welchem Thema verlierst du das Vertrauen, dass eure Beziehung einen sachlichen Widerspruch übersteht?",
  sup:"Grundsätzlich werden dürfen: die Grundsatzdebatte führen und keine faulen Kompromisse mehr machen. Freundlich und bestimmt zugleich, hart in der Sache, weich zur Person.",rup:"Kannst du jemandes Kompetenz grundsätzlich infrage stellen, ohne ihn als Menschen abzulehnen?",
  altDown:"Oder ist der Elefant echt? Wenn jeder Einzelfall nur ein Symptom ist, hilft Eingrenzen nicht. Dann die Grundsatzfrage einmal sauber stellen, statt sie in jedem Detail anzudeuten.",altUp:"Oder ist es wirklich nur der eine Punkt? Dann kläre genau den, mit Termin, statt ihn zum Dauerthema zu machen."},
 {id:'bes',dim:'sache',name:'Beschreibung',left:'einfältig',right:'vielfältig',
  q:{partei:'Gibt es aus deiner Sicht genau eine richtige Lösung, oder könntest du mehrere Sichtweisen gelten lassen?',beob:'Lässt diese Seite mehrere Sichtweisen auf Problem und Lösung zu, oder gilt für sie nur eine?'},
  lp:'Es gibt eine richtige Sicht: meine',rp:'Es gibt mehrere brauchbare Sichten',
  down:'Die Situation ist vielfältig, die Ansichten sind einfältig. Hol weitere Perspektiven ins Spiel: Fachleute, Betroffene, die Sicht aus dem Ganzen statt aus dem eigenen Bereich.',
  up:'Endloses Abwägen ist auch eine Fixierung. Wenn ein Einigungszwang besteht (Was? Wann? Wer?), braucht es Einfalt: einen Rahmen, eine Frist, eine Entscheidung. Ein Kompromiss darf dabei sachlich unvollkommen sein.',
  sdown:"Vielfalt zulassen: an dir zweifeln, ohne dich kleinzumachen. Ungewissheit aushalten und etwas ausprobieren, statt auf die perfekte Lösung zu warten.",rdown:"Wann hast du zuletzt jemandem recht gegeben, mit dem du am Anfang des Gesprächs über Kreuz lagst?",
  sup:"Einfalt vertreten: eine Sache ohne Wenn und Aber vertreten und dich damit angreifbar machen. Nicht zustimmen, nur um Frieden zu haben.",rup:"Weißt du in dieser Sache genug, um sie klar und gewinnend zu vertreten? Oder ersetzt gerade Lautstärke das Argument?",
  altDown:"Oder gibt es wirklich nur eine Lösung, und du vertrittst sie zu schwach? Dann nicht öffnen, sondern klar, begründet und mit Frist vertreten.",altUp:"Oder braucht die Sache tatsächlich noch Perspektiven? Dann hol sie gezielt und mit Frist, nicht als endloses Abwägen."},
 {id:'bew',dim:'sache',name:'Bewertung',left:'verabsolutiert',right:'unklar',
  q:{partei:'Wie sicher bist du, dass die andere Seite falsch liegt?',beob:'Argumentiert diese Seite mit richtig und falsch, gut und böse, oder kann sie offen lassen, wer am Ende recht hat?'},
  lp:'Ich habe recht. Punkt.',rp:'Beide könnten recht haben',
  down:'Wer der Bewertung widerspricht, widerspricht hier der Person. Bewegung wird erst möglich, wenn die bedrohte Identität anders Halt findet: erst Anerkennung, dann die Bewertung lockern.',
  up:'Ohne Einigkeit in den Bewertungen schwelt der Konflikt weiter. Irgendwann muss jemand sagen, was gilt. Standpunkte brauchen auch Kraft und Eindeutigkeit.',
  sdown:"Bewertungen prüfen, nicht gleich aufgeben: merken, wenn du dich verrannt hast, anderen Kompetenz zutrauen, auch mal fünf gerade sein lassen.",rdown:"Welche Überzeugung willst du auf keinen Fall infrage gestellt sehen? Was würde passieren, wenn du es doch tust?",
  sup:"Überzeugungen haben, die du nicht beim ersten Gegenwind relativierst. Dabei die Meinung bewerten, nie die Person.",rup:"Zweifelst du manchmal zu früh an dir, nur weil jemand dagegenhält?",
  altDown:"Oder ist die Sache so wichtig, dass sie eine klare Bewertung braucht? Dann bewerte die Meinung, nie die Person, und steh dazu.",altUp:"Oder ist Offenhalten richtig, weil niemand genug weiß? Dann sag das laut und setz den Zeitpunkt, an dem entschieden wird."},
 {id:'kon',dim:'sozial',name:'Kontakt',left:'feindlich',right:'dialogisch',
  q:{partei:'Erwartest du von der anderen Seite noch irgendetwas Gutes?',beob:'Unterstellt diese Seite der anderen Absicht, oder rechnet sie noch mit guten Motiven?'},
  lp:'Der andere will mir schaden',rp:'Der andere hat Gründe, die ich verstehen könnte',
  down:'Der Feind legitimiert die Aggression, die Aggression schafft den Feind. Prüfe die Unterstellungen: Welche Motive könnte die andere Seite haben, die nichts mit dir zu tun haben?',
  up:'Wer nur Dialog anbietet, kommt oft nicht zum Punkt. Der Konflikt schwelt. Hier darf jemand in den Ring steigen und Klartext sprechen, auch wenn das unfreundlich wirkt.',
  sdown:"Dialogfähig bleiben: dich im Konflikt selbst beobachten, aufhören, den anderen ändern zu wollen, den eigenen Gefühlen misstrauen und entschlüsseln, welche Not hinter seinem Verhalten steckt.",rdown:"Was soll der andere aufgeben, anders sehen oder anders fühlen? Und wozu bräuchtest du das?",
  sup:"Gegnerschaft anerkennen: sehen, dass jemand dir schaden will, die Schuldgefühle dabei aushalten und Grenzen markieren, an denen der Spaß aufhört. Feindlich heißt nicht vernichten wollen.",rup:"Kannst du Schuldgefühle aushalten, wenn du nicht nett bist, oder musst du sie sofort wegmachen?",
  altDown:"Oder stimmt die Gegnerschaft, und du gibst sie nur nicht zu? Wer dir schaden will, braucht kein Dialogangebot, sondern eine Grenze.",altUp:"Oder ist Dialog richtig, aber zu weich? Dann sag auch im Dialog, was dich stört, statt nur zu verstehen."},
 {id:'rea',dim:'sozial',name:'Reaktion',left:'verneinend',right:'wählend',
  q:{partei:'Wenn die andere Seite morgen etwas vorschlägt: Weißt du jetzt schon, dass du Nein sagst?',beob:'Sagt diese Seite reflexhaft Nein zu allem, oder wählt sie noch, worauf sie wie reagiert?'},
  lp:'Nein. Egal, was kommt.',rp:'Kommt drauf an, was kommt',
  down:'Der Sog zum Nein hat übernommen. Es geht nicht darum, Ja statt Nein zu sagen, sondern wieder wählen zu können: Was in der Aussage des anderen lässt sich bejahen? Und: langsamer antworten. Eine Nacht drüber schlafen ist keine Schwäche, sondern Spielraum.',
  up:'Manche Ordnung verflüssigt sich nur, wenn jemand entschieden widerspricht. Ein Nein, das Nein bleibt, auch wenn es zum Ja gedrängt wird, bricht Konfliktsymbiosen auf.',
  sdown:"Enttäuschbar sein: einlenken, auch wenn der andere das erst mal ausnutzt. Nachgeben können, nach einem Nein wieder Ja sagen, Widerspruch als Form von Kontakt erleben.",rdown:"Wie sehr machst du dein Einlenken davon abhängig, dass die andere Seite es sofort honoriert?",
  sup:"Nein sagen ohne Schuldgefühl: dich gut fühlen, auch wenn es dem anderen gerade schlecht geht, und gegenhalten, wenn er Nein sagt. Auch ein Nein ist ein Kontaktangebot.",rup:"Beschäftigt dich gerade das Wohlbefinden der anderen Seite mehr als dein eigenes?",
  altDown:"Oder ist dein Nein nicht das Problem, sondern zu leise? Wenn es eine Ordnung bricht, die gebrochen gehört, bleib einmal deutlich dabei, statt es unter Druck zurückzunehmen.",altUp:"Oder wählst du richtig, nur zu leise? Dann sprich das Ja aus, das du gehört hast. Und das Nein auch."},
 {id:'akt',dim:'sozial',name:'Aktion',left:'sendend',right:'erkundend',
  q:{partei:'Wer hat in den letzten Gesprächen mehr geredet als gefragt?',beob:'Redet diese Seite nur, oder erkundet sie noch, was die andere meint?'},
  lp:'Zwei Lautsprecher, kein Mikrofon',rp:'Was könnte der andere gemeint haben?',
  down:'Lautstärke erhöhen bringt nichts, wenn kein Mikrofon im Raum ist. Eigene Inhalte zurückstellen und auf das Bezug nehmen, was gesagt wurde. Erst verstehen, dann senden.',
  up:'Ständiges Erkunden kann dazu dienen, den Konflikt verborgen zu halten. Manchmal braucht es eine laute, zugespitzte, unbeeindruckbare Botschaft, damit überhaupt ein Konflikt entsteht, der sich bearbeiten lässt.',
  sdown:"Erkunden: die Lage mit den Augen des anderen sehen und darauf vertrauen, dass er sein Interesse an dir behält. Dein Selbstwert bleibt stabil, auch wenn du nicht landest. Im Gespräch: EAT, also Einfühlen, Akzeptieren, Transformieren.",rdown:"Wie sehr brauchst du es, dass die andere Seite einsieht, dass du recht hast?",
  sup:"Senden: dich zeigen, dich wichtig nehmen und behaupten, auch wenn du Ablehnung spürst. Höflichkeit kurz parken und mit Herzblut sagen, was dir wichtig ist.",rup:"Wie leicht bist du aus dem Feld zu schlagen, wenn dir jemand das Rederecht streitig macht?",
  altDown:"Oder wurde die Botschaft nie wirklich gesetzt, nur wiederholt? Dann einmal zugespitzt und unmissverständlich senden, statt lauter.",altUp:"Oder ist Fragen richtig, aber ohne Konsequenz? Dann erkunde einmal gründlich und sag danach, was du daraus schließt."},
 {id:'erk',dim:'zeit',name:'Erklärung',left:'linear',right:'zirkulär',
  q:{partei:'Wenn du erklärst, wie es dazu kam: Gibt es da einen Täter?',beob:'Sucht diese Seite den Schuldigen, oder sieht sie ihren eigenen Beitrag?'},
  lp:'Einer ist schuld',rp:'Alle haben beigetragen',
  down:'Wer einen Täter hat, wird handlungsfähig, und der Beschuldigte fühlt sich zum Zurückschlagen berechtigt. Henne oder Ei? Beides. Die bessere Frage: Was trage ich selbst gerade zum Konflikt bei?',
  up:'Zirkulär denken kann auch verschleiern. Wo Machtverhältnisse zementiert sind, braucht es eine klare Benennung von Verantwortung, sonst gibt es keinen Konflikt, den man bearbeiten könnte.',
  sdown:"Zirkulär denken: Schuld zugeben und Vorwürfe anerkennen, ohne dich zu verurteilen. Du musst nicht fehlerlos sein. Verantwortung heißt Urheber sein, nicht Schuldiger.",rdown:"Kannst du einem Vorwurf mit Neugier begegnen statt mit Verteidigung?",
  sup:"Linear benennen: falsches Verhalten klar ansprechen, Vorwürfe eindeutig zurückweisen und auch Schweigen, Rückzug und Nettigkeit als verdeckte Aggression beim Namen nennen. Das braucht ein gutes Verhältnis zur eigenen Aggression.",rup:"Kannst du klar sagen, welches Unrecht du beobachtet hast, auch wenn du selbst Fehler gemacht hast?",
  altDown:"Oder gibt es hier eine Verantwortung, die benannt gehört? Dann benenne sie einmal klar, ohne Anklagerunde.",altUp:"Oder stimmt die zirkuläre Sicht, nur ohne Folgen? Dann benenne deinen eigenen Beitrag konkret, nicht als Formel."},
 {id:'ziel',dim:'zeit',name:'Ziel',left:'durchsetzend',right:'unentschieden',
  q:{partei:'Willst du gewinnen, oder darf offen bleiben, wer sich womit durchsetzt?',beob:'Will diese Seite gewinnen, oder kann sie offen lassen, wer sich womit durchsetzt?'},
  lp:'Ich will gewinnen',rp:'Mal sehen, wer sich womit durchsetzt',
  down:'Solange es um Sieg geht, spielt keine Rolle mehr, wer recht hat. Es gewinnt, wer länger durchhält. Unentschieden aushalten heißt: sich lösen von den Interessen, die man gerade für die eigenen hält.',
  up:'Veränderung braucht eine Kraft, die in den Ring steigt. Wenn niemand gewinnen will, bleibt alles, wie es ist. Manchmal ist es richtig, dass es klare Verlierer gibt.',
  sdown:"Verlieren dürfen: ein Selbstwert, der nicht am Sieg hängt und Niederlage nicht an Scham koppelt. Offenlassen, wer vorne liegt, und neugierig sein, ob der Konflikt dich eines Besseren belehrt.",rdown:"Bleibt dein Wohlbefinden intakt, wenn du in dieser Sache verlierst? Oder schämst du dich dann?",
  sup:"Durchsetzen: Konkurrenz genießen, für Werte kämpfen, Zivilcourage zeigen und die Schmerzen eines Kampfes tragen. Ohne Mitleid, aber ohne den anderen dafür zum Feind zu machen.",rup:"Bremst du dich aus Mitleid mit der anderen Seite, obwohl die Sache es verlangt?",
  altDown:"Oder ist es richtig, dass du gewinnen willst, weil sonst etwas verloren geht? Dann setz dich durch, ohne den anderen zum Feind zu machen.",altUp:"Oder ist Unentschieden richtig, weil beide Wege taugen? Dann vereinbart, wie und wann entschieden wird."},
 {id:'macht',dim:'zeit',name:'Macht',left:'drohend',right:'verhandelnd',
  q:{partei:'Steht eine Drohung im Raum? Auch eine unausgesprochene?',beob:'Droht diese Seite mit Konsequenzen, oder lotet sie aus, was sie geben und bekommen kann?'},
  lp:'Wenn du nicht, dann ...',rp:'Gibst du mir, gebe ich dir',
  down:'Der Bedroher hat keine Macht, außer man gibt sie ihm. Drohungen sind oft ein Ausweg aus Ohnmacht und ernten Anpassung statt Einverständnis. Zurück ins Verhandeln: Was will jede Seite wirklich, und was wäre sie bereit zu geben? Und was macht jede Seite, wenn ihr euch nicht einigt?',
  up:'Wer nicht ernst genommen wird, braucht nicht zu reden. Eine glaubwürdige Konsequenz, die man wahrmachen kann und will, ist manchmal die Voraussetzung dafür, dass überhaupt verhandelt wird.',
  sdown:"Verhandeln: Risiko aushalten, statt auf Kontrolle zu setzen. Vorher durchdenken, was es kostet, Drohungen wahrzumachen. Auch Wichtiges loslassen und dem anderen gesichtswahrende Auswege lassen.",rdown:"Welche Gefühle hängen bei dir am Nachgeben? Und verhandelst du manchmal nur, weil du dich nicht zu kämpfen traust?",
  sup:"Glaubwürdig drohen: wissen, was dem anderen wichtig ist, eigene Verluste in Kauf nehmen und nicht zeigen, womit man dich beeindrucken kann. Oft klüger: warnen („Das passiert, wenn …“) statt drohen („Das tue ich, wenn …“).",rup:"Traust du dir zu, den Verlust zu tragen, den eine wahrgemachte Konsequenz auch für dich hätte?",
  altDown:"Oder ist die Drohung berechtigt, nur nicht glaubwürdig? Dann warne statt zu drohen: eine Konsequenz, die du tragen kannst und willst, einmal ausgesprochen.",altUp:"Oder ist Verhandeln richtig, nur ohne Alternative? Dann kenn deine, bevor du weiterverhandelst."}
 ],

 erg:{
  partei:[
   {q:'Wenn die andere Seite am Ende recht hätte: Was würde das über dich sagen?',o:['Nichts. Dann hatte ich eben unrecht.','Wäre unangenehm.','Dann wäre ich als Person infrage gestellt.']},
   {q:'Könntest du sagen: „Gut, dann nicht. Dann anders, woanders, ein anderes Mal"?',o:['Ja, es gibt andere Wege zu dem, was ich brauche.','Schwer.','Nein. So muss es sein.']},
   {q:'Wie viel Platz nimmt der Konflikt in deinem Kopf ein, wenn du gar nicht im Gespräch bist?',o:['Kaum.','Regelmäßig.','Er läuft ständig mit.']},
   {q:'Gibt es an dem Konflikt ein Gefühl, das du lieber nicht hättest? Scham, Schuld, Angst, Kränkung?',o:['Nein.','Ja, und ich kann es benennen.','Ja, und ich will nicht hinschauen.']}
  ],
  beob:[
   {q:'Haben sich Lager gebildet?',o:['Nein.','Ansatzweise.','Ja, mit Verbündeten auf beiden Seiten.']},
   {q:'Wird noch miteinander gesprochen oder nur noch übereinander?',o:['Miteinander.','Beides.','Nur noch übereinander.']},
   {q:'Halten sich die Umstehenden raus? Führung, Kollegen, du selbst?',o:['Nein, es wird eingegriffen.','Zögerlich.','Alle warten ab.']},
   {q:'Wie lange läuft das schon?',o:['Tage.','Wochen.','Monate oder länger.']}
  ]
 },
 startsPartei:[['ich','Ich'],['andere','Die andere Seite'],['beide','Beide'],['unklar','Weiß ich nicht mehr']],
 sideA:'Seite A',sideB:'Seite B',both:'Beide',unclear:'Unklar',
 steps:['Start','Vorab','Sache','Sozial','Zeit','Kernfrage','Ergebnis'],
 ui:{
  title:'Bug oder<br>Feature?',docTitle:'Bug oder Feature?',
  lead:'Ein Konflikt ist nicht das Problem. Das Problem ist, wenn er festhängt. Neun Regler, ein Profil, und am Ende die Frage, ob dieser Konflikt gerade schüren, beruhigen oder in Ruhe gelassen werden will.',
  roleq:'Von wo schaust du drauf?',r1:'Ich bin Partei',r1s:'Es ist mein Konflikt. Ich stecke drin.',r2:'Ich schaue von außen',r2s:'Zwei Menschen oder Gruppen in meinem Umfeld, ich bin nicht selbst Partei. Führungskraft, HR, Kollegin.',
  note:'Dauert etwa sechs Minuten. Nichts wird gespeichert oder gesendet. Grundlage ist die Konflikttheorie von Klaus Eidenschink.',
  go:'Los',back:'Zurück',next:'Weiter',result:'Ergebnis',
  crumb:'Konflikt-Check',crumbP:'Konflikt-Check · Ich bin Partei',crumbB:'Konflikt-Check · Blick von außen',
  s1e:'Eine Frage vorab',s1h:'Wer hat angefangen?',s1l:'Nicht lange überlegen. Erste Antwort.',
  names:'Die beiden Seiten',nameA:'Seite A, z. B. Vertrieb oder Frau K.',nameB:'Seite B',namesnote:'Optional. Namen bleiben im Browser.',
  d1e:'Sachdimension',d1h:'Worüber wird gestritten?',d1l:'Schieb den Regler dahin, wo der Konflikt gerade steht. Nicht, wo er hin soll.',
  d2e:'Sozialdimension',d2h:'Wie wird miteinander umgegangen?',d3e:'Zeitdimension',d3h:'Vergangenheit, Gegenwart, Zukunft',
  fixq:'Ist das immer so, oder je nach Tag?',fix0:'Je nach Tag',fix2:'Immer so',
  other:'Wo würde die andere Seite den Regler setzen?',
  ergP:'Hast du den Konflikt, oder hat er dich?',ergPe:'Die Kernfrage',ergB:'Hat der Konflikt schon das System?',ergBe:'Die Kernfrage von außen',
  foot:'Prototyp. Theoretische Grundlage: Klaus Eidenschink, „Die Kunst des Konflikts. Konflikte schüren und beruhigen lernen" (Carl-Auer). Die neun Leitunterscheidungen und die 18 Regulationskompetenzen sind seine, die Fragen, Bewertungslogik und Formulierungen stammen von Jacob Noon. Keine Diagnose, kein Ersatz für ein Gespräch.',
  yourResult:'Dein Ergebnis',hasYou:'Der Konflikt hat dich',hasSystem:'Der Konflikt hat das System',
  profile:'Das Bewegungsprofil',profileNote:'Links der Widerspruchspol, rechts der offene Pol. Kein Pol ist falsch. Eingerastet ist das Problem.',
  locked:'eingerastet',tend:'Tendenz',seeDiff:'Ihr seht das anders',lopsided:'Schieflage',
  legMoving:'beweglich',legTend:'weit außen, aber je nach Tag',legLocked:'eingerastet',legOther:'so würde es die andere Seite sehen',
  otherView:'Einschätzung der anderen Seite',
  movesH:'Wo es sich lohnt reinzugehen',
  movesMany:(n,m)=>`${n} Stellen sind eingerastet. Hier die ${m} härtesten, mehr auf einmal trägt kein Gespräch.`,
  movesFixed:'Pro eingerasteter Achse: die Gegenbewegung, die Fähigkeit dahinter und die Gegenprobe. Welche Bewegung bringt den Konflikt dahin, wofür er da ist?',
  movesTend:'Nichts ist eingerastet. Hier die Achsen mit Tendenz, bevor sie es werden.',
  movesBeob:' Die Bewegung gehört der jeweiligen Seite. Deine Aufgabe von außen: den Rahmen schaffen, in dem sie möglich wird.',
  calm:'Beruhigen',stir:'Schüren',fromTo:(a,b)=>`von ${a} zu ${b}`,skill:'Fähigkeit dahinter:',
  noFix:'Keine Achse ist eingerastet oder kippt gerade. Dein Job ist jetzt nicht, den Konflikt zu beenden, sondern ihn zu einer Entscheidung kommen zu lassen. Achte auf die Sachdimension: Wird noch über die Sache gestritten, oder wandert es Richtung Person?',
  axesN:n=>n===1?'einer Achse':n+' Achsen',
  asymH:'Asymmetrie',asym:(n,list,A,B)=>`Auf ${n} (${list}) stehen ${A} und ${B} drei oder mehr Schritte auseinander. Das ist kein Zufall, sondern oft das Muster selbst: Die härtere Seite eskaliert, weil sie nicht ernst genommen wird. Die weichere Seite hält den Konflikt am Leben, weil nichts entschieden wird. Beide brauchen Bewegung, in entgegengesetzte Richtungen. Von außen heißt das oft: der weicheren Seite Rückendeckung geben. Das ist keine Parteinahme, sondern die Voraussetzung dafür, dass beide im Ring stehen.`,
  gapH:'Wie die andere Seite es wohl sieht',gap:(n,list)=>`Auf ${n} (${list}) liegen deine Einschätzung und die vermutete der anderen Seite drei oder mehr Schritte auseinander. Das ist selbst ein Befund: Ihr streitet nicht nur über die Sache, ihr seht auch den Streit verschieden. Wer das laut ausspricht, macht die Kommunikation wieder unvorhersehbar.`,
  unusedH:'Was gar nicht im Spiel ist',unused:(list)=>`${list}: Diese Achsen stehen in der Mitte. Das kann Beweglichkeit sein. Es kann auch heißen, dass dieser Modus in eurem Konflikt gar nicht vorkommt. Eidenschink: Was nie bedient wird, ist selbst ein Befund. Was wäre, wenn hier jemand den Pol wechseln würde?`,
  firstH:'Noch mal zur ersten Frage',
  firstBoth:e=>`Du hast „Beide" gesagt. Das ist die zirkuläre Sicht, gut. Prüf einmal, ob das Überzeugung ist oder Höflichkeit. Dein Regler beim Erklärungsmodus steht ${e<0?'trotzdem beim Täter':e===0?'in der Mitte':'ebenfalls bei „alle haben beigetragen"'}.`,
  firstUnclear:'Du hast „Unklar" gesagt. Ehrlich. Das ist oft die genaueste Antwort, denn wer den Anfang klärt, hat noch keinen Schuldigen. Und erst die Schuldfrage füttert den Konflikt.',
  firstOne:x=>`Du hast gesagt: <b>${x}</b>. Eidenschink würde fragen: Henne oder Ei? Beides. Am Konflikt haben alle beigetragen, auch die, die sich rausgehalten haben. Wer einen Täter hat, wird handlungsfähig, und der Beschuldigte fühlt sich zum Zurückschlagen berechtigt. Den Anfang zu klären ist erlaubt. Einen Schuldigen zu suchen füttert den Konflikt.`,
  forkH:'Die Weiche',
  forkP:{caught:['Coaching','Der Konflikt hat dich: Identität, Gefühl oder Strategie hängen dran. Der Impuls gegen die Konfliktlogik muss dann aus dir kommen, nicht aus einer Gesprächstechnik. Es geht nicht darum, alles zu können, sondern die eigenen Gefährdungen zu kennen. Verstehen hilft beim Sortieren, Gefühle ändern sich aber nur über Erleben, und allein geht das selten. Genau dafür ist Coaching da.'],locked:['Mediation','Der Konflikt ist eingerastet, du bist aber noch handlungsfähig. Eine dritte Person kann die Kommunikation wieder unvorhersehbar machen, was ihr zu zweit gerade nicht schafft.'],self:['Selbst weitermachen','Nimm dir eine Achse vor, nicht alle. Ein Gespräch, ein Modus, eine Bewegung. Frag dich dabei: Wo könntest du den Pol wechseln, und was riskierst du damit? Wenn es nach zwei Anläufen nicht kippt, melde dich.']},
  forkB:{caught:['Konfliktmoderation im Team','Der Konflikt hat das System: Lager, Übereinander-Reden, Abwarten. Das ist keine Sache für ein Vier-Augen-Gespräch mehr. Hier braucht es einen moderierten Rahmen mit allen Beteiligten.'],locked:['Mediation zwischen den Beteiligten','Die beiden Seiten sind eingerastet, das Umfeld noch nicht. Jetzt ist der Moment für eine klärende Mediation, bevor das System kippt.'],self:['Ein Führungsgespräch reicht vermutlich','Sprich die eine Achse an, die oben steht. Und prüfe, ob dein Raushalten Teil des Musters ist. Wer sich nicht einmischt, hat den Anfang nicht verhindert.']},
  cta:'Gespräch mit Jacob Noon anfragen',ctaUrl:'https://jacobnoon.com/coaching/',
  quote:'Nicht der Pol ist das Problem.<br>Das Einrasten ist es.',quoteSub:'Konflikte brauchen beide Pole. Wer regulieren will, muss beides können: schüren und beruhigen. Eidenschink nennt das eine „Immunisierung gegen Konfliktsog wie gegen Friedenszwang“.',
  backSliders:'Zurück zu den Reglern',restart:'Neu starten',
  verdictBug:'Bug',verdictSmoulder:'Schwelbrand',verdictLop:'Schieflage',verdictFeature:'Feature',
  vBug:(n,r)=>`Der Konflikt ernährt sich selbst. Auf ${n} ist er am Widerspruchspol eingerastet: Nein erzeugt Nein, die Sache spielt kaum noch eine Rolle. Hier lohnt meist Beruhigen, aber nicht pauschal, sondern Achse für Achse.${r?` Gleichzeitig ist er auf ${r} am offenen Pol eingerastet, dort fehlt eher die Härte.`:''}`,
  vSmoulder:n=>`Der Konflikt wird gemieden, nicht reguliert. Auf ${n} ist er am offenen Pol eingerastet: viel Verständnis, viel Dialog, keine Entscheidung. Was hier meist fehlt, ist die Fähigkeit zu schüren.`,
  vLop:(n,A,B)=>`Die beiden Seiten stehen nicht im selben Konflikt. Auf ${n} liegen ${A} und ${B} weit auseinander: Eine Seite ist im Ring, die andere nicht. Eidenschink: Nur wenn zwei ebenbürtig im Ring stehen, lassen sich die Sachkonflikte besprechen. Die weiche Seite muss schüren lernen, die harte beruhigen.`,
  vFeature:'Der Konflikt bewegt sich noch. Er tut, wofür Konflikte da sind: eine Entscheidung zwischen Alternativen herbeiführen und eine neue Ordnung ermöglichen. Nicht lösen. Regulieren. Halte die Bewegung am Leben.',
  vMixed:'Der Konflikt ist auf beiden Seiten eingerastet: an manchen Stellen zu hart, an anderen zu weich. So kann er weder entscheiden noch beruhigen. Unten steht, wo welche Bewegung fehlt.',
  axisOf:(i,n)=>`Achse ${i} von ${n}`,qOf:(i,n)=>`Frage ${i} von ${n}`,
  pickNote:'Wähl bis zu zwei, die du mitnimmst. Nur die landen in deiner Zusammenfassung.',pick:'Nehm ich mit',picked:'Mitgenommen',

  reflect:'Frag dich:',altH:'Gegenprobe:',altQ:'Welche Bewegung bringt den Konflikt dahin, wofür er da ist?',sharper:'Prägnanter',pickDir:d=>'Mitnehmen: '+d,
  funcH:'Wozu ist der Konflikt da?',
  func:'Ob Schüren oder Beruhigen hilft, lässt sich erst sagen, wenn du eine Vermutung hast, wozu der Konflikt dient. Konflikte stellen eine Ordnung infrage, die nicht mehr trägt. Wenn deiner sprechen könnte: Was will er verändern? Und wem dient er, dir, der anderen Seite, eurer Beziehung oder dem Umfeld?',
  funcB:'Ob Schüren oder Beruhigen hilft, lässt sich erst sagen, wenn du eine Vermutung hast, wozu der Konflikt dient. Konflikte stellen eine Ordnung infrage, die nicht mehr trägt. Wenn dieser sprechen könnte: Was will er verändern? Und wem dient er, den Beteiligten, ihrer Zusammenarbeit oder dem Team drumherum?',
  funcEx:'Mögliche Antworten: eine Grenze neu ziehen, Rollen klären, ein Tabu sichtbar machen, eine Ungerechtigkeit beenden, ein besseres Ergebnis erzwingen, eine Trennung, die längst fällig ist.',
  funcPh:'Deine Vermutung, optional. Eine Hypothese reicht. Sie darf falsch sein.',
  costH:'Was kostet es, wenn es so bleibt?',
  cost:{sache:'Angenommen, ihr einigt euch nicht: Was macht jede Seite dann? Wer diese Frage nicht beantworten will, ahnt meist, dass die Alternative teurer ist als ein Kompromiss.',sozial:'Welchen Preis zahlt ihr gerade still mit, Rückzug, Kündigungen, Oberflächlichkeit, weil euch etwas anderes wichtiger ist? Wenn ihr den Preis bewusst zahlt, ist das kein Konflikt mehr, sondern eine Entscheidung. Dann sprecht sie aus.',zeit:'Was kostet es, wenn die Entscheidung noch einmal vertagt wird? Welche Möglichkeiten ziehen vorbei, während gestritten wird?'},
  sumFunc:'Wozu der Konflikt da ist (meine Vermutung)',sumCost:'Was es kostet, wenn es so bleibt',

  prepH:'Und jetzt konkret',prepLead:'Ein Gespräch, ein Zug. Was willst du als Nächstes tun?',prepSpeak:'Ich will es ansprechen',prepListen:'Ich will zuhören',
  feedH:'Ansprechen mit FEED',feedNote:'Vier Sätze in dieser Reihenfolge: das Beobachtbare, die Wirkung, das Gefühl, die Richtung. Das Interesse dazwischen ist die Brücke von Gefühl zu Richtung.',
  feed:[
   ['Facts: Was ist faktisch passiert?','Beobachtbar, ohne Deutung. „Am Dienstag hast du die Deadline ohne Rücksprache verschoben.“'],
   ['Effect: Welche Wirkung hat das?','Sachlich und persönlich. „Dadurch musste ich dem Kunden absagen.“'],
   ['Emotion: Wie geht es dir damit?','Ein Gefühl, ein Wort. „Das hat mich geärgert.“'],
   ['Interesse: Was brauchst du eigentlich?','Das Bedürfnis hinter der Forderung. „Ich brauche Verlässlichkeit bei Terminen.“'],
   ['Direction: Was soll anders werden?','Konkret, einmal, prüfbar. „Sag mir vorher Bescheid, wenn sich ein Termin verschiebt.“']
  ],
  dirH:'Richtung',dirAsk:'Als Bitte',dirDemand:'Als Forderung',
  dirHint:{bug:'Dein Konflikt ist am Widerspruchspol eingerastet. Eine Bitte beruhigt, weil sie der anderen Seite die Wahl lässt. „Kannst du mir vorher Bescheid sagen?“',schwel:'Dein Konflikt wird gemieden. Eine Forderung schürt, weil sie klarmacht, dass hier eine Entscheidung fällig ist. „Ich erwarte, dass du mir vorher Bescheid sagst.“',lop:'Die weichere Seite braucht hier eher die Forderung, die härtere die Bitte. Wähl nach der Seite, von der du sprichst.',feature:'Eine Bitte lässt die Wahl und beruhigt. Eine Forderung nimmt sie und schürt. Wähl, was der Konflikt gerade braucht.',mixed:'Eine Bitte lässt die Wahl und beruhigt. Eine Forderung nimmt sie und schürt. Wähl nach der Achse, an der du ansetzt.'},
  eatH:'Zuhören mit EAT',eatNote:'Erst einfühlen, dann annehmen, dann erst bewegen. Am Anfang keine Fragen. Wer als Erstes fragt, verhört. Die Frage kommt im dritten Schritt.',
  eat:[
   ['Einfühlen','Was ist bei der anderen Seite gerade los? Nicht, was sie sagt, sondern wie es ihr geht.','„Du bist gerade richtig unter Druck.“'],
   ['Akzeptieren','Stehen lassen. Ohne Bewertung, ohne Aber, ohne gleich zu antworten.','„Okay. Ich sehe das.“'],
   ['Transformieren','Erst jetzt die Sache. Eine Frage, die aus dem Gehörten kommt.','„Was bräuchtest du, damit das anders läuft?“']
  ],
  eatQ:'Was hat die andere Seite gesagt, das du stehen lassen kannst?',eatPh:'Ein Satz von ihr, ohne dein Aber.',
  sumFeed:'Mein nächster Zug: ansprechen (FEED)',sumEat:'Mein nächster Zug: zuhören (EAT)',sumDir:'Richtung:',
  counterH:'Was spricht dagegen?',
  counter:{
   bug:'Das Urteil sagt: festgefahren. Nenn einen Moment aus den letzten zwei Wochen, in dem sich doch etwas bewegt hat. Ein Satz, ein Zugeständnis, ein Lachen. Findest du keinen, stimmt das Urteil. Findest du einen, liegt dort dein Hebel.',
   schwel:'Das Urteil sagt: Der Konflikt wird gemieden. Nenn die letzte Entscheidung, die in dieser Sache wirklich gefallen ist. Fällt dir keine ein, stimmt das Urteil. Dann die unbequeme Frage: Wem nützt es, dass nichts entschieden wird? Und eine Gegenprobe: Nicht jeder kalte Konflikt muss heiß werden. Wenn der Zeitpunkt schlecht ist oder die Kraft fehlt, darf man ihn parken. Aber ausgesprochen und mit Termin, nicht stillschweigend.',
   lop:'Das Urteil sagt: Eine Seite ist im Ring, die andere nicht. Prüf, ob die weichere Seite still ist, weil sie einverstanden ist, oder weil sie sich nicht traut. Und ob du die härtere Seite härter siehst, als sie ist.',
   feature:'Das Urteil sagt: Der Konflikt bewegt sich. Prüf, ob er sich bewegt oder nur im Kreis dreht. Was ist seit seinem Beginn entschieden worden? Wenn nichts: Schau noch mal auf die Regler. Warst du freundlicher als die Lage?',
   mixed:'Das Urteil sagt: zu hart und zu weich zugleich. Welchen Teil davon würde die andere Seite unterschreiben, welchen nicht? Wo du Widerspruch erwartest, sitzt meist der blinde Fleck.'
  },
  counterPh:'Deine Antwort, optional. Bleibt im Browser und landet nur in deiner Zusammenfassung.',
  exportH:'Deine Zusammenfassung',
  exportNote:'Urteil, eingerastete Achsen, deine Karten mit Reflexionsfrage, deine Vermutung zur Funktion und deine Antwort auf die Gegenfrage. Zum Mitnehmen ins nächste Gespräch oder ins Erstgespräch mit Jacob. Nichts davon verlässt deinen Browser, bis du es selbst weitergibst.',
  copy:'Ergebnis kopieren',pdf:'Als PDF speichern',copied:'Kopiert. Du kannst es jetzt einfügen.',copyFail:'Kopieren ging nicht automatisch. Der Text ist markiert, kopier ihn mit Strg+C bzw. Cmd+C.',
  sumTitle:'Konflikt-Check: Zusammenfassung',sumPersp:'Perspektive',sumVerdict:'Urteil',sumLocked:'Eingerastet',sumTend:'Tendenz',sumNone:'keine Achse',
  sumMoves:'Meine Bewegungen',sumMovesAll:'Vorgeschlagene Bewegungen (keine ausgewählt)',sumAns:'Meine Antwort:',sumFork:'Empfehlung',
  sumSource:'Erstellt mit dem Konflikt-Check auf jacobnoon.com/konflikt-check/. Grundlage: Klaus Eidenschink, „Die Kunst des Konflikts". Keine Diagnose.'
 }

en:{
 axes:[
 {id:'auf',dim:'sache',name:'Attention',left:'generalised',right:'specific',
  q:{partei:"What's it about right now? Still the one concrete thing, or by now 'always', 'never' and 'in principle'?",beob:'Is this side still arguing about the concrete point, or has everything become the topic?'},
  lp:'The molehill has become a mountain',rp:"It's about exactly one thing",
  down:'Move attention from the general back to the specific. Where exactly is the difference? Where have you long agreed? Narrow down what divides you, name what you share.',
  up:'If only the individual case ever gets discussed, that can be a way of playing it down. Name the mountain behind the molehill: what is this actually about?',
  sdown:"Staying specific: keeping disagreement on the matter apart from rejection of the person. Bracketing your feelings rather than suppressing them. Your self-worth doesn't depend on being proved right.",rdown:"On which topic do you lose faith that your relationship will survive a disagreement on substance?",
  sup:"Being allowed to generalise: having the debate about principles and no longer making lazy compromises. Friendly and firm at once, hard on the issue, soft on the person.",rup:"Can you question someone's competence fundamentally without rejecting them as a person?",
  altDown:"Or is the mountain real? If every single case is only a symptom, narrowing down won't help. Then raise the question of principle once, properly, instead of hinting at it in every detail.",altUp:"Or is it really just the one point? Then settle exactly that, with a date, instead of making it a permanent topic."},
 {id:'bes',dim:'sache',name:'Description',left:'single-minded',right:'many-sided',
  q:{partei:'From where you stand, is there exactly one right solution, or could you let several views stand?',beob:'Does this side allow several views of problem and solution, or does only one count?'},
  lp:"There's one right view: mine",rp:'There are several workable views',
  down:'The situation is many-sided, the views are single-minded. Bring in more perspectives: experts, the people affected, the view from the whole rather than from your own patch.',
  up:"Endless weighing-up is a way of getting stuck too. If there's pressure to agree (what? when? who?), single-mindedness is needed: a frame, a deadline, a decision. A compromise is allowed to be imperfect on the substance.",
  sdown:"Allowing variety: doubting yourself without making yourself small. Bearing uncertainty and trying something out instead of waiting for the perfect solution.",rdown:"When did you last concede a point to someone you strongly disagreed with at the start of the conversation?",
  sup:"Standing for one view: arguing for something without ifs and buts, and making yourself vulnerable by doing so. Not agreeing just to keep the peace.",rup:"Do you know enough about this to argue for it clearly and persuasively? Or is volume standing in for the argument right now?",
  altDown:"Or is there really only one solution, and you're arguing for it too weakly? Then don't open up. Argue it clearly, with reasons and a deadline.",altUp:"Or does the matter genuinely need more perspectives? Then bring them in deliberately and with a deadline, not as endless weighing-up."},
 {id:'bew',dim:'sache',name:'Evaluation',left:'absolute',right:'open',
  q:{partei:'How sure are you that the other side is wrong?',beob:"Does this side argue in right and wrong, good and bad, or can it leave open who's right in the end?"},
  lp:"I'm right. Full stop.",rp:'Both of us could be right',
  down:'Whoever contradicts the judgement here contradicts the person. Movement only becomes possible once the threatened identity finds a footing elsewhere: recognition first, then loosen the judgement.',
  up:"Without agreement on what's good and right, the conflict keeps smouldering. At some point someone has to say what counts. Positions need force and clarity too.",
  sdown:"Testing judgements rather than dropping them: noticing when you have dug yourself in, trusting others to be competent too, letting something go when there are good reasons.",rdown:"Which conviction do you never want to see questioned? What would happen if you questioned it anyway?",
  sup:"Holding convictions you do not relativise at the first headwind. Judging the opinion, never the person.",rup:"Do you sometimes doubt yourself too early, just because someone pushes back?",
  altDown:"Or does the matter need a clear judgement because it is that important? Then judge the opinion, never the person, and stand by it.",altUp:"Or is keeping it open right, because nobody knows enough yet? Then say so out loud and set the date when it gets decided."},
 {id:'kon',dim:'sozial',name:'Contact',left:'hostile',right:'dialogic',
  q:{partei:'Do you still expect anything good from the other side?',beob:'Does this side assume the other is acting on purpose, or does it still credit them with decent motives?'},
  lp:"They're out to hurt me",rp:'They have reasons I could understand',
  down:'The enemy legitimises the aggression, the aggression creates the enemy. Test your assumptions: what motives could the other side have that have nothing to do with you?',
  up:'Someone who only ever offers dialogue often never gets to the point. The conflict smoulders. Here somebody is allowed to step into the ring and speak plainly, even if it comes across as unfriendly.',
  sdown:"Staying capable of dialogue: watching yourself in the conflict, giving up on changing the other person, mistrusting your own feelings and working out which need is driving their behaviour.",rdown:"What should the other person give up, see differently or feel differently? And what would you need that for?",
  sup:"Acknowledging opposition: seeing that someone wants to harm you, bearing the guilt that comes with it and marking the line where the fun stops. Hostile does not mean wanting to destroy.",rup:"Can you tolerate feeling guilty when you're not being nice, or do you have to make the feeling go away at once?",
  altDown:"Or is the opposition real, and you just won't admit it? Someone who wants to harm you needs a boundary, not an offer of dialogue.",altUp:"Or is dialogue right, but too soft? Then say what bothers you inside the dialogue, instead of only understanding."},
 {id:'rea',dim:'sozial',name:'Reaction',left:'negating',right:'choosing',
  q:{partei:"If the other side suggests something tomorrow, do you already know you'll say no?",beob:'Does this side say no to everything on reflex, or does it still choose what to react to and how?'},
  lp:'No. Whatever it is.',rp:'Depends what it is',
  down:"The pull towards no has taken over. This isn't about saying yes instead of no, it's about being able to choose again: what in what the other side says could you agree with? And: answer more slowly. Sleeping on it isn't weakness, it's room to move.",
  up:"Some arrangements only shift when somebody contradicts them firmly. A no that stays a no, even when it's pushed towards yes, breaks up conflict symbioses.",
  sdown:"Being able to be disappointed: giving ground even if the other side exploits it at first. Being able to yield, to say yes again after a no, to experience contradiction as a form of contact.",rdown:"How much does your willingness to give ground depend on the other side rewarding it straight away?",
  sup:"Saying no without guilt: feeling fine even when the other person is feeling bad right now, and holding firm when they say no. A no is an offer of contact too.",rup:"Are you more preoccupied with how the other side is feeling than with how you are?",
  altDown:"Or isn't your no the problem, just too quiet? If it breaks an arrangement that deserves breaking, stay with it clearly, once, instead of taking it back under pressure.",altUp:"Or are you choosing rightly, just too quietly? Then say the yes you heard out loud. And the no as well."},
 {id:'akt',dim:'sozial',name:'Action',left:'broadcasting',right:'exploring',
  q:{partei:'In the last few conversations, who did more talking than asking?',beob:'Does this side only talk, or does it still explore what the other means?'},
  lp:'Two loudspeakers, no microphone',rp:'What might they have meant?',
  down:"Turning up the volume does nothing if there's no microphone in the room. Park your own content and respond to what was actually said. Understand first, then broadcast.",
  up:"Constant exploring can be a way of keeping the conflict hidden. Sometimes it takes a loud, pointed, unimpressed message before there's a conflict at all that can be worked on.",
  sdown:"Exploring: seeing the situation through the other person's eyes and trusting that they stay interested in you. Your self-worth holds even if you don't land. In the conversation: EAT, that is Empathise, Accept, Transform.",rdown:"How much do you need the other side to admit that you are right?",
  sup:"Broadcasting: showing yourself, taking yourself seriously and holding your ground even when you sense rejection. Parking politeness for a moment and saying with conviction what matters to you.",rup:"How easily are you knocked off your stride when someone fights you for the floor?",
  altDown:"Or has the message never actually been set, only repeated? Then send it once, pointed and unmistakable, instead of louder.",altUp:"Or is asking right, but without consequence? Then explore thoroughly once and afterwards say what you conclude."},
 {id:'erk',dim:'zeit',name:'Explanation',left:'linear',right:'circular',
  q:{partei:'When you explain how it came to this, is there a culprit?',beob:'Is this side looking for the culprit, or does it see its own contribution?'},
  lp:"Someone's to blame",rp:'Everyone contributed',
  down:'Having a culprit makes you feel able to act, and the accused feels entitled to hit back. Chicken or egg? Both. The better question: what am I contributing to the conflict right now?',
  up:"Circular thinking can also be a cover. Where power relations are set in concrete, responsibility needs naming clearly, otherwise there's no conflict to work on at all.",
  sdown:"Thinking in circles: admitting fault and acknowledging accusations without condemning yourself. You do not have to be flawless. Responsibility means being the author, not the culprit.",rdown:"Can you meet an accusation with curiosity rather than defence?",
  sup:"Naming it in a straight line: addressing wrong behaviour clearly, rejecting accusations firmly and naming silence, withdrawal and niceness as hidden aggression. That takes a good relationship with your own aggression.",rup:"Can you say clearly what wrong you have seen, even though you have made mistakes yourself?",
  altDown:"Or is there a responsibility here that needs naming? Then name it once, clearly, without a round of accusations.",altUp:"Or is the circular view right, just without consequences? Then name your own contribution concretely, not as a formula."},
 {id:'ziel',dim:'zeit',name:'Goal',left:'winning',right:'undecided',
  q:{partei:'Do you want to win, or can it stay open who gets their way on what?',beob:'Does this side want to win, or can it leave open who prevails on what?'},
  lp:'I want to win',rp:"Let's see who gets their way on what",
  down:"As long as it's about victory, who's right no longer matters. Whoever lasts longer wins. Bearing 'undecided' means letting go of the interests you currently take to be your own.",
  up:"Change needs a force that steps into the ring. If nobody wants to win, everything stays as it is. Sometimes it's right that there are clear losers.",
  sdown:"Being allowed to lose: a self-worth that does not hang on victory and does not tie defeat to shame. Leaving open who is ahead, and being curious whether the conflict might teach you better.",rdown:"Does your wellbeing stay intact if you lose on this? Or would you feel ashamed?",
  sup:"Prevailing: enjoying competition, fighting for values, showing moral courage and bearing the pain a fight brings. Without pity, but without turning the other person into an enemy to manage it.",rup:"Are you holding back out of pity for the other side, even though the matter demands otherwise?",
  altDown:"Or is wanting to win right, because otherwise something is lost? Then prevail, without turning the other into an enemy.",altUp:"Or is undecided right, because both routes work? Then agree how and when it gets decided."},
 {id:'macht',dim:'zeit',name:'Power',left:'threatening',right:'negotiating',
  q:{partei:'Is there a threat in the room? Even an unspoken one?',beob:'Does this side threaten consequences, or does it sound out what it can give and get?'},
  lp:"If you don't, then ...",rp:"You give me this, I'll give you that",
  down:"The person threatening has no power unless it's handed to them. Threats are often an escape from powerlessness and harvest compliance rather than agreement. Back to negotiating: what does each side actually want, and what would it be prepared to give? And what will each side do if you don't reach agreement?",
  up:"If you're not being taken seriously, there's no point talking. A credible consequence, one you can and will follow through on, is sometimes the precondition for any negotiation at all.",
  sdown:"Negotiating: bearing risk instead of relying on control. Thinking through beforehand what it would cost to carry out threats. Letting go of things that matter and leaving the other side a way out that saves face.",rdown:"Which feelings are tied up for you with giving way? And do you sometimes negotiate only because you do not dare to fight?",
  sup:"Threatening credibly: knowing what matters to the other side, accepting losses of your own and not showing what can impress you. Often wiser: warning ('this will happen if ...') rather than threatening ('this is what I will do if ...').",rup:"Do you trust yourself to bear the loss that carrying out a consequence would mean for you too?",
  altDown:"Or is the threat justified, just not credible? Then warn instead of threatening: a consequence you can and will carry, said once.",altUp:"Or is negotiating right, just without an alternative? Then know yours before you negotiate any further."}
 ],

 ui:{
  title:'Bug or<br>Feature?',docTitle:'Bug or Feature?',
  lead:"A conflict isn't the problem. A conflict that's stuck is. Nine sliders, one profile, and at the end the question whether this conflict needs stirring up, calming down, or leaving alone.",
  roleq:'Where are you looking from?',r1:"I'm a party to it",r1s:"It's my conflict. I'm in it.",r2:"I'm looking from outside",r2s:"Two people or groups around me, and I'm not one of the parties. Line manager, HR, colleague.",
  note:"Takes about six minutes. Nothing is stored or sent. Based on Klaus Eidenschink's theory of conflict.",

  crumb:'Conflict Check',crumbP:"Conflict Check · I'm a party",crumbB:'Conflict Check · View from outside',

  names:'The two sides',nameA:'Side A, e.g. Sales or Ms K.',nameB:'Side B',namesnote:'Optional. Names stay in your browser.',
  d1e:'The matter',d1h:'What is the row about?',d1l:'Move the slider to where the conflict is right now. Not where it should be.',
  d2e:'The social side',d2h:'How are they treating each other?',d3e:'Time',d3h:'Past, present, future',

  noFix:"No axis is locked or tipping right now. Your job isn't to end the conflict but to let it reach a decision. Watch the matter itself: is the argument still about the substance, or is it drifting towards the person?",
  axesN:n=>n===1?'one axis':n+' axes',
  asymH:'Asymmetry',asym:(n,list,A,B)=>`On ${n} (${list}) ${A} and ${B} are three or more steps apart. That's no accident, it's often the pattern itself: the harder side escalates because it isn't being taken seriously. The softer side keeps the conflict alive because nothing gets decided. Both need to move, in opposite directions. From outside that often means backing the softer side. That isn't taking sides, it's the precondition for both being in the ring.`,
  gapH:"The other side's view",gap:(n,list)=>`On ${n} (${list}) your assessment and the one you assume for the other side are three or more steps apart. That's a finding in itself: you're not only arguing about the matter, you also see the argument differently. Saying that out loud makes the communication unpredictable again.`,
  unusedH:"What isn't in play at all",unused:(list)=>`${list}: these axes sit in the middle. That can be flexibility. It can also mean this mode never shows up in your conflict at all. Eidenschink: what never gets used is a finding in itself. What if somebody switched poles here?`,
  firstH:'Back to the first question',
  firstBoth:e=>`You said 'Both'. That's the circular view, good. Check once whether that's conviction or politeness. Your slider on explanation mode ${e<0?'still points at a culprit':e===0?'sits in the middle':"also sits at 'everyone contributed'"}.`,
  firstUnclear:"You said 'Unclear'. Fair. That's often the most accurate answer, because clarifying the start doesn't name a culprit. It's the blame question that feeds the conflict.",
  firstOne:x=>`You said: <b>${x}</b>. Eidenschink would ask: chicken or egg? Both. Everyone contributed to the conflict, including those who stayed out of it. Having a culprit makes you feel able to act, and the accused feels entitled to hit back. Clarifying how it started is fine. Hunting for the culprit feeds the conflict.`,
  forkH:'The fork in the road',
  forkP:{caught:['Coaching',"The conflict has you: identity, feeling or strategy are tied up in it. The impulse against the logic of the conflict then has to come from you, not from a conversation technique. It isn't about being able to do everything, it's about knowing where you're vulnerable. Understanding helps you sort things out, but feelings only change through experience, and that rarely works alone. That's exactly what coaching is for."],locked:['Mediation',"The conflict is locked, but you can still act. A third person can make the communication unpredictable again, which is what the two of you can't manage right now."],self:['Carry on yourself',"Take on one axis, not all of them. One conversation, one mode, one movement. Ask yourself: where could you switch poles, and what would you be risking? If it hasn't tipped after two attempts, get in touch."]},
  forkB:{caught:['Conflict facilitation in the team','The conflict has the system: camps, talking about rather than to, waiting it out. This is no longer a matter for a one-to-one. It needs a facilitated setting with everyone involved.'],locked:['Mediation between the parties',"The two sides are locked, the surroundings aren't yet. This is the moment for a clarifying mediation, before the system tips."],self:['A conversation with your team member will probably do',"Address the one axis shown above. And check whether your staying out of it is part of the pattern. Whoever doesn't step in didn't prevent the start."]},
  cta:'Request a conversation with Jacob Noon',ctaUrl:'https://jacobnoon.com/en/coaching/',
  quote:'Not the pole is the problem.<br>Getting stuck is.',quoteSub:'Conflicts need both poles. Regulating them means being able to do both: stir up and calm down. Eidenschink calls it being immune to the pull of conflict and to the pressure for peace alike.',
  backSliders:'Back to the sliders',restart:'Start again',
  verdictBug:'Bug',verdictSmoulder:'Smouldering',verdictLop:'Lopsided',verdictFeature:'Feature',
  vBug:(n,r)=>`The conflict is feeding itself. On ${n} it has locked onto the contradiction pole: no breeds no, the actual matter barely counts any more. Calming down usually pays here, but not across the board, axis by axis.${r?` At the same time it's locked onto the open pole on ${r}, and there it's firmness that's missing.`:''}`,
  vSmoulder:n=>`The conflict is being avoided, not regulated. On ${n} it's locked onto the open pole: plenty of understanding, plenty of dialogue, no decision. What's usually missing here is the ability to stir things up.`,
  vLop:(n,A,B)=>`The two sides aren't in the same conflict. On ${n} ${A} and ${B} are far apart: one side is in the ring, the other isn't. Eidenschink: only when two stand in the ring as equals can they discuss the actual matter. The softer side has to learn to stir up, the harder side to calm down.`,
  vFeature:"The conflict is still moving. It's doing what conflicts are for: forcing a decision between alternatives and making a new order possible. Don't resolve it. Regulate it. Keep the movement alive.",
  vMixed:'The conflict is locked on both sides: too hard in some places, too soft in others. That way it can neither decide nor settle. Below is where which movement is missing.',
  axisOf:(i,n)=>`Axis ${i} of ${n}`,qOf:(i,n)=>`Question ${i} of ${n}`,
  pickNote:'Pick up to two to take with you. Only those go into your summary.',pick:'Take this one',picked:'Taken',

  reflect:'Ask yourself:',altH:'Cross-check:',altQ:'Which movement takes the conflict to what it is for?',sharper:'Sharper',pickDir:d=>'Take: '+d,
  funcH:'What is the conflict for?',
  func:"Whether stirring or calming helps can only be judged once you have a hunch about what the conflict is for. Conflicts question an order that no longer holds. If yours could speak: what does it want to change? And whom does it serve: you, the other side, your relationship or the people around you?",
  funcB:"Whether stirring or calming helps can only be judged once you have a hunch about what the conflict is for. Conflicts question an order that no longer holds. If this one could speak: what does it want to change? And whom does it serve: the people involved, how they work together, or the team around them?",
  funcEx:'Possible answers: redrawing a boundary, clarifying roles, bringing a taboo into the open, ending an injustice, forcing a better result, a separation that is long overdue.',
  funcPh:'Your hunch, optional. A hypothesis is enough. It is allowed to be wrong.',
  costH:'What does it cost if it stays like this?',
  cost:{sache:"Suppose you don't reach agreement: what will each side do then? Whoever won't answer that question usually suspects the alternative costs more than a compromise.",sozial:"What price are you quietly paying right now, withdrawal, people leaving, superficiality, because something else matters more? If you pay it knowingly, it isn't a conflict any more, it's a decision. Then say it out loud.",zeit:'What does it cost if the decision gets postponed once more? Which possibilities are passing by while the argument goes on?'},
  sumFunc:'What the conflict is for (my hunch)',sumCost:'What it costs if it stays like this',

  prepH:'And now, concretely',prepLead:'One conversation, one move. What do you want to do next?',prepSpeak:'I want to raise it',prepListen:'I want to listen',

  dirH:'Direction',dirAsk:'As a request',dirDemand:'As a demand',
  dirHint:{bug:"Your conflict is locked on the contradiction pole. A request calms, because it leaves the other side a choice. 'Could you let me know beforehand?'",schwel:"Your conflict is being avoided. A demand stirs, because it makes clear a decision is due. 'I expect you to let me know beforehand.'",lop:'The softer side needs the demand here, the harder side the request. Choose by the side you are speaking from.',feature:'A request leaves the choice and calms. A demand takes it and stirs. Choose what the conflict needs right now.',mixed:'A request leaves the choice and calms. A demand takes it and stirs. Choose by the axis you are working on.'},
