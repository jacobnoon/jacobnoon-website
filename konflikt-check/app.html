<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bug oder Feature?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  --green:#4CC265; --green-deep:#2E9A48; --green-tint:#E9F8EC;
  --blue:#3B82C4; --blue-tint:#E7F0FA;
  --orange:#D9552B; --orange-tint:#FBECE6;
  --gold:#E6A817; --gold-tint:#FCF3DC;
  --ink:#111114; --ink-2:#3E4441; --ink-3:#6B7370;
  --line:#DCE3DE; --line-soft:#ECF0ED;
  --bg:#F9FAFB; --card:#FFFFFF; --track:#EDF1EE;
  --shadow:0 1px 2px rgba(17,17,20,.06), 0 8px 24px rgba(17,17,20,.06);
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green-deep:#6BD883; --green-tint:#17301D;
    --blue-tint:#15263A; --orange-tint:#3A1D14; --gold-tint:#3A2C0E;
    --ink:#F4F6F4; --ink-2:#C9CFCB; --ink-3:#8F9994;
    --line:#2C332F; --line-soft:#232926;
    --bg:#111114; --card:#1A1D1B; --track:#262B28;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --logo-light:none; --logo-dark:block;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.embedded{background:transparent}
h1,h2,h3,.os{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:500;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,7vw,56px);line-height:.98;text-transform:uppercase}
h2{font-size:clamp(24px,4.5vw,32px);line-height:1.1;text-transform:uppercase}
h3{font-size:19px;line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
a{color:var(--green-deep)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green-deep)}
.muted{color:var(--ink-3)}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 40px}
body.embedded .wrap{padding:0 0 8px}
.frame{background:var(--card);border-top:3px solid var(--green);border-bottom:3px solid var(--green);box-shadow:var(--shadow);position:relative}
.frame::after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--green);opacity:.55}
.frame::before{content:"";position:absolute;left:0;right:0;bottom:9px;height:1px;background:var(--green);opacity:.55}
.head{display:flex;justify-content:space-between;align-items:center;padding:26px 32px 0}
.logo{display:block;line-height:0}
.logo img{height:36px;width:auto}
.logo .logo-light{display:var(--logo-light,block)}
.logo .logo-dark{display:var(--logo-dark,none)}
.progress{height:3px;background:var(--track);margin:18px 32px 0;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .35s ease}
.stepline{display:flex;justify-content:space-between;padding:8px 32px 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.screen{padding:28px 32px 36px}
@media (max-width:560px){.head,.progress,.stepline,.screen{padding-left:18px;padding-right:18px}.progress{margin-left:18px;margin-right:18px}}
.lead{font-size:18px;color:var(--ink-2);max-width:60ch}
.stack{display:grid;gap:22px}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;cursor:pointer;padding:13px 22px;background:var(--ink);color:var(--bg);letter-spacing:.02em;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.chip:focus-visible,.choice:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--green);color:#0B1F10}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line);padding:11px 18px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line-soft)}
.choices{display:grid;gap:10px}
.choice{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);padding:16px 18px;color:var(--ink);display:grid;gap:3px;transition:border-color .15s,background .15s}
.choice b{font-family:Oswald;font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.choice span{color:var(--ink-3);font-size:14px}
.choice:hover{border-color:var(--green)}
.choice.sel{border-color:var(--green);background:var(--green-tint)}
.namegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.namegrid label,.topic label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);padding:0 12px;background:var(--card)}
.namegrid input,.topic input{font:inherit;font-size:15px;border:0;background:transparent;color:var(--ink);padding:12px 0;width:100%;min-width:0}
.namegrid input:focus,.topic input:focus{outline:none}
.namegrid label:focus-within,.topic label:focus-within{border-color:var(--green)}
.dot-a,.dot-b{flex:none;width:12px;height:12px;border-radius:50%;background:var(--green)}
.dot-b{background:var(--blue)}
@media (max-width:560px){.namegrid{grid-template-columns:1fr}}
.field{display:grid;gap:8px}
.field .lbl{font-size:14px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:13px;color:var(--ink-3)}
/* chat question */
.q-dir{font-family:Oswald;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--green-deep)}
.q{font-size:21px;font-weight:500;line-height:1.3;max-width:34ch;margin:6px 0 18px}
.bridge{font-size:15px;color:var(--ink-3);font-style:italic;margin-bottom:14px}
.chips{display:grid;gap:9px}
.chip{font:inherit;font-size:15.5px;line-height:1.35;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 18px;color:var(--ink);transition:border-color .15s,background .15s,transform .08s}
.chip:hover{border-color:var(--green)}
.chip.sel{border-color:var(--green);background:var(--green-tint)}
.chip.sel.lock{border-color:var(--orange);background:var(--orange-tint)}
.chip.zero{color:var(--ink-3);border-style:dashed}
.chip.zero.sel{color:var(--ink);border-style:solid}
.follow{margin-top:16px;padding:14px 16px;background:var(--blue-tint);display:grid;gap:10px;animation:fade .25s ease}
.follow .fl{font-size:14px;color:var(--ink-2);font-weight:500}
.follow .mini{display:flex;flex-wrap:wrap;gap:8px}
.mini .chip{font-size:14px;padding:8px 14px;border-radius:18px}
.chips.mini{gap:7px}.chips.mini .chip{text-align:left;border-radius:18px}
.mini .chip.sel{border-color:var(--blue);background:var(--card);box-shadow:inset 0 0 0 1px var(--blue)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* result */
.verdict{display:grid;gap:8px;padding:22px 24px;border-left:6px solid var(--gold);background:var(--gold-tint)}
.verdict.bug{border-color:var(--orange);background:var(--orange-tint)}
.verdict.schwel{border-color:var(--blue);background:var(--blue-tint)}
.verdict h2{font-size:clamp(34px,6vw,48px)}
.verdict p{max-width:62ch}
.lesart{display:grid;gap:12px}
.lesart p{font-size:17px;line-height:1.5}
.lesart p b{font-family:Oswald;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep);margin-right:8px}
.callout{padding:16px 18px;border-left:5px solid var(--blue);background:var(--blue-tint);display:grid;gap:6px}
.callout .eyebrow{color:var(--blue)}
.callout.gold{border-left-color:var(--gold);background:var(--gold-tint)}
.callout.gold .eyebrow{color:#7A5300}
.callout.dark{background:var(--ink);color:var(--bg);border-left-color:var(--green)}
.callout.dark .eyebrow{color:var(--green)}
.moves{display:grid;gap:12px}
.move{border:1.5px solid var(--line);padding:16px 18px;display:grid;gap:6px}
.gloss{display:grid;gap:10px;margin-top:12px}.gl{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}.gl b{font-family:Oswald;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--green-deep)}@media (max-width:560px){.gl{grid-template-columns:1fr;gap:4px}}
.move .n{font-family:Oswald;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.move .t{font-size:17px}
.move .w{font-size:14px;color:var(--ink-3)}
.prof{display:grid;gap:0;border:1px solid var(--line);padding:6px 14px}
.prof .dim{font-family:Oswald;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green-deep);padding:10px 0 4px}
.prow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.prow:last-child{border-bottom:0}
.prow .ax{font-family:Oswald;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.prow .st{color:var(--ink-3);font-size:13px;text-align:right}
.prow .st.lock{color:var(--orange);font-weight:700}
.export-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.toast{font-size:13px;color:var(--green-deep);min-height:1em}
.ta{font:inherit;font-size:14px;width:100%;min-height:120px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;margin-top:8px}
.foot{font-size:12.5px;color:var(--ink-3);padding:14px 32px 22px;max-width:70ch}
@media (max-width:560px){.foot{padding-left:18px;padding-right:18px}}
.lang{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.lang a{color:var(--ink-3);text-decoration:none;margin-left:6px}
.lang a.on{color:var(--ink);font-weight:700}

/* ===== PRINT (PDF) ===== */
#printSheet{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;color:#111114!important}
  .wrap{display:none!important}
  #printSheet{display:block!important;font-family:"DM Sans",Arial,sans-serif;font-size:10.2pt;line-height:1.42;color:#111114}
  #printSheet *{box-sizing:border-box}
  .pg{width:210mm;height:297mm;overflow:hidden;padding:12mm 16mm 10mm;page-break-after:always;display:flex;flex-direction:column}
  .pg:last-child{page-break-after:auto}
  .pg header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:4mm;border-bottom:2.2px solid #4CC265}
  .pg .kicker{font-family:Oswald;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:8.5pt;color:#6B6F76}
  .pg h1{font-family:Oswald;font-weight:700;font-size:24pt;line-height:1;margin:1.5mm 0 0;text-transform:uppercase;letter-spacing:.01em}
  .pg header img{height:11mm;width:auto}
  .pg main{flex:1;padding-top:4mm;min-height:0}
  .pg footer{border-top:2.2px solid #4CC265;padding-top:2.5mm;font-size:7.6pt;color:#6B6F76;display:flex;justify-content:space-between;gap:8mm}
  .pg h2{font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:13pt;letter-spacing:.03em;margin:0 0 2mm;color:#111114}
  .pg h2 span{color:#4CC265}
  .pg h3{font-family:Oswald;font-weight:500;text-transform:uppercase;font-size:9.5pt;letter-spacing:.1em;color:#6B6F76;margin:0 0 1.5mm}
  .pg p{margin:0 0 2.2mm}
  .pv{display:flex;gap:6mm;align-items:center;margin-bottom:5mm}
  .pv .tag{font-family:Oswald;font-weight:700;font-size:30pt;line-height:1;text-transform:uppercase;color:#D9552B}
  .pv .tag.schwel{color:#3B82C4}.pv .tag.feature{color:#2E9A48}
  .pv .count{font-size:10.5pt;max-width:120mm}
  .pprof{margin:2.5mm 0 4mm;border:1px solid #E3E5E8;border-radius:3px;padding:3mm 4mm}
  .prw{display:grid;grid-template-columns:30mm 26mm 1fr 26mm 30mm;align-items:center;font-size:8.6pt;padding:1.1mm 0;border-bottom:1px solid #F9FAFB}
  .prw:last-child{border-bottom:0}
  .prw .axis{font-family:Oswald;font-weight:500;font-size:9pt;letter-spacing:.04em;text-transform:uppercase}
  .prw .pole{color:#6B6F76}.prw .pole.r{text-align:right}
  .scale{display:flex;justify-content:space-between;align-items:center;padding:0 2mm;position:relative}
  .scale:before{content:"";position:absolute;left:2mm;right:2mm;top:50%;height:1px;background:#E3E5E8}
  .dot{width:3.2mm;height:3.2mm;border-radius:50%;background:#fff;border:1px solid #E3E5E8;position:relative}
  .dot.on{background:#4CC265;border-color:#4CC265}
  .dot.lock{background:#D9552B;border-color:#D9552B;width:4.2mm;height:4.2mm}
  .prw .who{font-size:8pt;color:#6B6F76;text-align:right}.prw .who.lock{color:#D9552B;font-weight:500}
  .pdim{font-family:Oswald;font-weight:500;font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#4CC265;padding:1.5mm 0 .5mm}
  .ples p{font-size:10.4pt}
  .ples p b{font-family:Oswald;font-weight:500;font-size:9pt;letter-spacing:.06em;text-transform:uppercase;color:#4CC265;margin-right:1.5mm}
  .hypo{background:#F9FAFB;border-left:3px solid #3B82C4;padding:2.2mm 4mm;margin:2.5mm 0}
  .hypo b{color:#3B82C4;font-family:Oswald;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:9pt}
  .gegen{border-left:3px solid #E6A817;padding:2mm 4mm;margin:3mm 0 0;font-size:9.6pt}
  .gegen b{color:#E6A817;font-family:Oswald;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:9pt}
  .pblock{margin-bottom:4mm}
  .pblock ol{margin:0;padding-left:5.5mm}
  .pblock li{margin-bottom:1.8mm;padding-left:1mm}
  .pblock li .q{font-weight:500;font-size:inherit;line-height:inherit;margin:0;max-width:none;display:inline}
  #printSheet .q{font-size:inherit;margin:0;max-width:none}
  .pblock li .why{display:block;color:#6B6F76;font-size:8.6pt;margin-top:.4mm}
  .say{list-style:none;padding:0;margin:0}
  .say li{border:1px solid #E3E5E8;border-radius:3px;padding:2.2mm 3.5mm 2.2mm 4mm;margin-bottom:1.8mm;position:relative}
  .say li:before{content:"„";font-family:Oswald;font-weight:700;font-size:22pt;color:#4CC265;position:absolute;left:1.6mm;top:-1mm;line-height:1}
  .say li .t{display:block;padding-left:4mm;font-size:10pt}
  .say li .why{display:block;padding-left:4mm;color:#6B6F76;font-size:8.4pt;margin-top:.6mm}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:7mm}
  .pframe{background:#111114;color:#fff;padding:3mm 4mm;border-radius:3px;margin-bottom:4mm}
  .pgloss{margin-top:2.5mm;border-top:1px solid #E3E5E8;padding-top:2mm;font-size:8.2pt;line-height:1.3}.pgloss h3{font-family:Oswald;font-size:9.5pt;letter-spacing:.08em;text-transform:uppercase;margin:0 0 1.5mm;color:#111114}.pgloss p{margin:0 0 .9mm}.pgloss b{font-family:Oswald;letter-spacing:.04em;color:#2E9B47}
  .pframe h3{color:#4CC265;margin-bottom:1mm}
  .pframe p{margin:0;font-size:9.4pt}
  .small{font-size:8.6pt;color:#6B6F76}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    frame3:'Nimm nicht die Sache in die Hand. Frag beide Seiten getrennt: „Was brauchst du von mir?" Und sag es weiter, nicht als Bote, sondern als Spiegel.',
    frame1P:'Dein erstes Werkzeug ist EAT: Einfühlen, Akzeptieren, Transformieren. Nenn zuerst, was du bei der anderen Seite wahrnimmst, ohne Fragezeichen. Erst wenn sie sich gesehen fühlt, kommt deine Frage. Dann dein FEED, und wieder hören. Beide Werkzeuge unten erklärt.',

en:{
  title:'Bug or Feature?',
  crumb:'Conflict Check',
  steps:{start:'Start',who:'Who',sache:'Matter',sozial:'Manner',zeit:'Time',func:'Function',result:'Result'},
  of:'of',
  back:'Back',next:'Next',toResult:'See the result',restart:'Start again',
  intro:{
    h:'Bug or Feature?',
    lead:'Not every conflict is a problem. Some are doing their job. Eleven questions, a few taps, and you will know whether this one is stuck, where, and what you can do next.',
    note:'Nothing leaves your browser. No sign-up, nothing stored. At the end you get a write-up to copy or save as a PDF.',
    roleQ:'Before we start: where do you stand in this conflict?',
    roles:[
      ['I am in it.','You are one of the two sides.'],
      ['I\'m on the sidelines, but it affects me.','Partner, colleague, family. Not a party, but not neutral either.'],
      ['I am looking at it from outside.','Coach, manager, mediator.']
    ]
  },
  who:{
    h:'Who is in conflict?',
    lead:'Give the two sides a name. This stays on your device.',
    a:'Side A',b:'Side B',phA:'e.g. John Doe',phB:'e.g. Jane Doe',
    selfA:'You',selfB:'The other side',selfAd:'you',selfBd:'the other side',
    topicL:'What is it about? Three to five words, with an article.',topicPh:'e.g. the holiday rota',
    topicHint:'Goes into the write-up so the sentences sound like your conflict. Best as a noun phrase: "the holiday rota", not "who takes the holidays".',
    nextQ:'Who will you talk to next?',
    nextBoth:'Both',nextNone:'Not sure yet'
  },
  bridges:{
    sache:'First the matter: what is the conflict about?',
    sozial:'Now the manner: how is it being fought?',
    zeit:'Finally, time: where does it come from, where is it going, who has the upper hand?'
  },
  zero:'Does not come up for us',
  follow:{q:'Does that apply to both?',both:'Both',mostly:'Mainly {n}',other:'And {n}? Where does {n} stand on this axis?',you:'Mainly me',otherSide:'Mainly the other side',askOther:'And the other side? Where do they stand on this axis?',askYou:'And you? Where do you stand on this axis?'},
  axes:[
    {name:'Attention',dim:'sache',dir:'Topic',q:'Are you arguing about a specific incident, or about the principle by now?',
     poleA:'about the principle',poleB:'about the single case',
     chips:['Only about the principle now. Every incident becomes proof of the bigger picture: "That is so typical."','It usually turns into a matter of principle quickly.','It usually stays with the specific incident.','Only single cases. Every incident is ticked off on its own; a pattern is not allowed to exist.'],
     lesP:'Every molehill becomes a mountain. It is no longer about the incident but about the whole, and every new incident confirms it.',
     lesM:'Every incident is dealt with on its own, as if there were no pattern. That keeps the peace and keeps the real question off the table.',
     partyP:'Next time, name only the incident, with date and wording. No "always", no "typical", no "in principle".',
     partyM:'Say the pattern out loud for once instead of the single case: "This is not about {thema}. It is about the fact that I cannot rely on you."',
     obsP:'What was it about last time, concretely, without the word "always"?',
     obsM:'If you lay the last three times side by side: what repeats?',
     whyP:'First what happened, without a verdict. That is the first step of FEED: Facts.',whyM:'Naming a pattern is not an attack. It is what makes the conflict negotiable in the first place.',
     reflP:'What would be lost if you kept this one incident small and did not open up the bigger picture this time?',
     reflM:'Do you dare to turn three incidents into a pattern, even if that makes you look petty or unforgiving?'},
    {name:'Description',dim:'sache',dir:'The facts',q:'How fixed is each side\'s account of what happened?',
     poleA:'set in stone',poleB:'all open',
     chips:['Each side has its version set in stone. No doubt anywhere.','The versions are fairly fixed.','There are shades and "maybes".','Everything is open, nobody commits, even when it would be needed.'],
     lesP:'Each side has its story finished. There is nothing left to learn, only to prove.',
     lesM:'Nobody commits. Everything stays in suspension, so nobody has to make themselves vulnerable.',
     partyP:'Mark your story as an assumption: "My working hypothesis is …" From certainty to curiosity.',
     partyM:'Commit: "From my point of view, at this moment, with the information I have, I want you to do X, because Y."',
     obsP:'Which part of your version are you least sure of?',
     obsM:'If you had to commit today, what would your sentence be?',
     whyP:'Your version as a hypothesis, not as minutes. That leaves room for the other story.',whyM:'What happened, what it triggers, what you want: the full FEED. "At this point" keeps the door open.',
     reflP:'When did you last concede to someone you were at odds with at the start of the conversation?',
     reflM:'Do you know enough about this matter to argue it clearly and convincingly? Or is volume replacing the argument?'},
    {name:'Evaluation',dim:'sache',dir:'Judgement',q:'How is the other side\'s behaviour judged?',
     poleA:'absolute',poleB:'nobody judges',
     chips:['Judgements are absolute: "You just don\'t do that." Full stop.','Judgements are clear and rarely softened.','Judgements get checked; people let things slide.','Nobody dares to judge. Everything is "a matter of opinion", even things that clearly cross a line.'],
     lesP:'The judgements are final. Whoever pushes back is not of a different opinion but wrong.',
     lesM:'Nobody dares to judge. So even behaviour that clearly crosses a line goes unchallenged.',
     partyP:'Separate opinion and person: "I think that is wrong" instead of "You are …". And ask yourself out loud: "What would have to happen for me to rethink my judgement?"',
     partyM:'Make a judgement and let it stand, even against pushback: "This does not work like this. Full stop." Do not soften at the first objection.',
     obsP:'What would have to happen for you to rethink your judgement?',
     obsM:'What do you find plainly wrong here, and why don\'t you say it?',
     whyP:'Observation instead of evaluation, as in Rosenberg. Acknowledging is not agreeing.',whyM:'Short and complete: what happened, what it does to you, what you need. A compact FEED.',
     reflP:'Which conviction do you refuse to see questioned? What would happen if you did?',
     reflM:'Do you sometimes doubt yourself too early, just because someone pushes back?'},
    {name:'Contact',dim:'sozial',dir:'Manner',q:'How do you treat each other, as opponents or as people in conversation?',
     poleA:'as opponents',poleB:'only understanding',
     chips:['As opponents. Harm is allowed, and silence or ignoring is part of it.','More like opponents, with distrust.','You still talk and try to understand.','Only understanding, even where someone is doing real harm right now.'],
     lesP:'You treat each other as opponents. That includes the silence and ignoring that looks like calm.',
     lesM:'You are so busy showing understanding that neither of you can simply say: "That hurt me."',
     partyP:'Decode the need behind the behaviour before you react, and say it, without a question mark: "I can see that {thema} will not let you go."',
     partyM:'Mark a boundary and name the need behind it: "This is where it stops for me, because I need …" Then sit with the guilt.',
     obsP:'What does the other side want that you do not credit them with right now?',
     obsM:'Where has the other side hurt you, and who have you told?',
     whyP:'Empathise without a question mark, the first step of EAT. Your question comes once the other side nods.',whyM:'Three parts: your boundary, the need behind it, your offer. Understanding also needs a no.',
     reflP:'What should the other person give up, see differently or feel differently? And what would that do for you?',
     reflM:'Can you bear feeling guilty when you are not nice, or do you have to make it go away at once?'},
    {name:'Reaction',dim:'sozial',dir:'Reaction',q:'What happens when one side makes a proposal?',
     poleA:'reflex no',poleB:'always yes',
     chips:['A reflex no. Whatever comes, the answer is no, a block, or the proposal is simply talked over.','Mostly no, with exceptions.','It gets weighed; sometimes yes, sometimes no.','Always yes or giving in, just to have peace.'],
     lesP:'Whatever comes, the answer is no. Two nos feed each other: the more pressure, the tighter the door.',
     lesM:'Someone always gives in. That keeps the surface smooth while everything left unsaid builds up underneath.',
     partyP:'Answer more slowly. A night between proposal and no. Or just: "Difficult." Neither yes nor no, buys time, keeps contact.',
     partyM:'Say no once without a reason and without an apology. Or the soft no: "That is hard to imagine at this moment. What I could imagine: …"',
     obsP:'What is the smallest yes you can imagine?',
     obsM:'When did you last say no, and what happened?',
     whyP:'Under pressure, do not fire back: three seconds of silence, then stay in the conversation, empathise, or name the pressure.',whyM:'A clear no does not end the relationship. It is an offer of contact with an edge.',
     reflP:'How much does your willingness to give ground depend on the other side appreciating it immediately?',
     reflM:'Are you more concerned with the other side\'s wellbeing right now than with your own?'},
    {name:'Action',dim:'sozial',dir:'Talking and listening',q:'Who explains, who asks?',
     poleA:'only talking at',poleB:'only asking',
     chips:['Both talk at each other. Nobody asks how the other side is doing.','More talking at than asking.','At least one side asks and listens.','Only asking and understanding. Nobody says what they want themselves.'],
     lesP:'Both talk at each other, nobody asks. Each side explains, neither wants to understand.',
     lesM:'Only asking and understanding. What each side actually wants stays unsaid.',
     partyP:'Ask a question before you explain, and bear the answer. Back to making your point only after permission: "Are you willing to hear my view?"',
     partyM:'Park politeness for a moment and say with heart what matters to you. FEED to the end, without answering interruptions. Then silence.',
     obsP:'What do you know about how the other side is doing with this?',
     obsM:'What do you want yourself, and when did you last say it?',
     whyP:'Listen and strengthen first, then ask permission, then your view. That turns "yes, but" into "yes, and".',whyM:'Like a risotto: keep stirring gently instead of switching off the stove. The silence after your question belongs to the other side.',
     reflP:'How much do you need the other side to see that you are right?',
     reflM:'How easily are you driven off the field when someone disputes your right to speak?'},
    {name:'Explanation',dim:'zeit',dir:'Blame and contribution',q:'Who started it, and who sees their own part?',
     poleA:'one culprit',poleB:'all "complex"',
     chips:['There is a culprit. Done.','Usually one side started it.','Both see that they contribute.','Everything is "complex" and "both of us". Nobody names what went wrong.'],
     lesP:'There is a culprit. As long as that is settled, nobody has to look at their own contribution.',
     lesM:'Everything is "complex" and "both of us". So what really went wrong never gets named.',
     partyP:'Name one contribution of your own, concretely, without a "but". Responsibility means owning your part, not taking the blame.',
     partyM:'State clearly, just once, what you saw go wrong, even if you made mistakes yourself. And call silence and withdrawal by their name: that is aggression too, only quiet.',
     obsP:'What was your contribution to it getting this far?',
     obsM:'What went wrong here, whoever started it?',
     whyP:'From blame to contribution: who added what? That question can be answered together, the blame question cannot.',whyM:'Once, clearly and in a straight line: this happened, this is what it caused. Not everything is circular.',
     reflP:'Can you meet an accusation with curiosity instead of defence?',
     reflM:'Can you state clearly what you saw go wrong, even if you made mistakes yourself?'},
    {name:'Goal',dim:'zeit',dir:'Outcome',q:'What is it about in the end, winning or a solution?',
     poleA:'winning',poleB:'nobody decides',
     chips:['About winning. The other side has to back down.','Each side would rather be proved right.','It is open how it ends.','Nobody wants to decide anything. It stays open, even when it hurts.'],
     lesP:'It is about winning. Giving way would be a defeat, so nobody gives way.',
     lesM:'Nobody wants to decide. The conflict stays open because leaving it open hurts less than losing.',

const NSTEPS=14;

function renderAxis(sc,i){

/* ===== evaluation ===== */
const DIMRANK={zeit:3,sozial:2,sache:1};

  }else{
    const other=S.role===1&&S.next===0?c.B:S.role===1&&S.next===1?c.A:null;
    if(S.role===1)say.push({t:fill(U.sayFrame,{other:other||(L==='de'?'Die andere Seite':'The other side')}),w:U.whyFrame});
    say.push({t:fill(U.sayEat,c),w:U.sayEatWhy});
    if(f2txt)say.push({t:fill(U.sayHypo,{f2:f2txt}),w:U.sayHypoWhy});
    else say.push({t:U.sayNeed,w:U.sayNeedWhy});
    trio.forEach(i=>{const {ax,P}=T3(i);ask.push({t:fill(P?ax.obsP:ax.obsM,c),w:ax.name})});
    if(ask.length<3)ask.push({t:U.sayNeed,w:U.sayNeedWhy});
  }
  trio.forEach(i=>{const {ax,P}=(S.role===0?own(i):T3(i));refl.push({t:P?ax.reflP:ax.reflM,w:ax.name})});
  return{c,locked,nP,nM,nZero,nOpp,verdict,vtext,sorted,top,line,sideTag,count,hypo,f2txt,opp,addressee,say,ask,refl};
}

function renderResult(sc){
  const E=evaluate(), c=E.c;
  let h=`<div class="stack">`;
  // verdict
  h+=`<div class="verdict ${E.verdict==='bug'?'bug':E.verdict==='schwel'||E.verdict==='schief'?'schwel':''}"><p class="eyebrow">${U.h}</p><h2>${U.verdict[E.verdict]}</h2><p><b>${esc(E.count)}</b> ${E.vtext}${S.topic.trim()?' '+esc(fill(U.aboutTopic,c)):''}</p></div>`;
  // lesart
  if(E.top.length){h+=`<div class="lesart"><h3>${U.lesH}</h3>${E.top.map(i=>`<p><b>${T.axes[i].name}</b>${esc(E.line(i))}${E.sideTag(i)?` <span class="muted" style="font-size:13px">(${esc(E.sideTag(i))})</span>`:''}</p>`).join('')}</div>`}
  // hypothesis
  h+=`<div class="callout"><p class="eyebrow">${U.hypoH}</p><p>${esc(E.hypo||U.hypoNone)}</p></div>`;
  E.opp.forEach(o=>{h+=`<div class="callout"><p class="eyebrow">${U.oppH}</p><p>${esc(o)}</p></div>`});
  if(E.nZero>=4)h+=`<div class="callout"><p class="eyebrow">${U.unusedH}</p><p>${esc(fill(U.unused,{n:numw(E.nZero)}))}</p></div>`;
  if(E.locked.length)h+=`<div class="callout gold"><p class="eyebrow">${U.gegenH}</p><p>${U.gegen}</p></div>`;
  // frame
  const frame=S.role===1?fill(U.frame2,{other:(S.next===0?c.B:S.next===1?c.A:(L==='de'?'Die andere Seite':'The other side'))}):S.role===2?U.frame3:(E.nP>=E.nM?U.frame1P:U.frame1M);
  h+=`<div class="callout dark"><p class="eyebrow">${U.frameH}</p><p>${esc(frame)}</p></div>`;
  // moves
  h+=`<div><h3>${U.movesH}</h3><div class="moves" style="margin-top:12px">`;
  const askH=E.addressee?fill(U.askHTo,{n:E.addressee}):(S.role===0?U.askHOther:U.askH);
  h+=`<div class="move"><span class="n">${U.sayH}</span>${E.say.map(s=>`<p class="t">${QQ(esc(s.t))}</p><p class="w">${esc(s.w)}</p>`).join('')}</div>`;
  h+=`<div class="move"><span class="n">${esc(askH)}</span>${E.ask.map(s=>`<p class="t">${esc(s.t)}</p><p class="w">${esc(s.w)}</p>`).join('')}</div>`;
  if(E.refl.length)h+=`<div class="move"><span class="n">${U.reflH}</span><p class="w">${S.role===0?U.reflSubSelf:U.reflSub}</p>${E.refl.map(s=>`<p class="t">${esc(s.t)}</p><p class="w">${esc(s.w)}</p>`).join('')}</div>`;
  h+=`</div></div>`;
  // profile
  h+=`<div><h3>${U.profH}</h3><div class="prof" style="margin-top:12px">`;
  let lastDim='';
  T.axes.forEach((a,i)=>{
    if(a.dim!==lastDim){h+=`<div class="dim">${U.dims[a.dim]}</div>`;lastDim=a.dim}
    const v=S.v[i];let st,cls='';
    if(Math.abs(v)===2){st=(v>0?a.poleA:a.poleB)+' · '+U.st.lock+(E.sideTag(i)?', '+E.sideTag(i):'');cls='lock'}
    else if(v===0)st=U.st.zero;
    else st=(v>0?a.poleA:a.poleB)+' · '+U.st.tend+(E.sideTag(i)?', '+E.sideTag(i):'');
    h+=`<div class="prow"><span class="ax">${a.name}</span><span class="st ${cls}">${esc(st)}</span></div>`;
  });
  h+=`</div></div>`;
  // glossary
  h+=`<div><h3>${U.glossH}</h3><div class="gloss">${U.gloss.map(g=>`<div class="gl"><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div>`).join('')}</div></div>`;
  // export
  h+=`<div class="callout" style="background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--green)"><p class="eyebrow" style="color:var(--green-deep)">${U.exportH}</p><p>${U.exportNote}</p><div class="export-btns"><button class="btn primary" type="button" id="pdfBtn">${U.pdf}</button><button class="btn ghost" type="button" id="copyBtn">${U.copy}</button></div><p class="toast" id="copyMsg"></p><textarea class="ta" id="copyFallback" hidden></textarea></div>`;
  h+=`<div class="callout gold"><p class="eyebrow">${U.coachH}</p><p>${U.coach}</p><div class="export-btns"><a class="btn" href="${U.coachUrl}" target="_blank" rel="noopener">${U.coachBtn}</a></div></div>`;
  h+=`<div class="nav"><button class="btn ghost" type="button" id="back">${T.back}</button><button class="btn ghost" type="button" id="restart">${T.restart}</button></div>`;
  h+=`</div>`;
  sc.innerHTML=h;
  $('#back').onclick=()=>show(step-1);
  $('#restart').onclick=()=>{location.href=location.pathname+(L==='en'?'?lang=en':'')};
  $('#copyBtn').onclick=()=>copySum(E);
  $('#pdfBtn').onclick=()=>printSum(E);
}

/* ===== export ===== */
function sumText(E){
  const c=E.c;let t=`${T.title} · ${U.h}\n${U.verdict[E.verdict]} ${E.count} ${E.vtext}\n`;
  if(S.topic.trim())t+=fill(U.aboutTopic,c)+'\n';
  t+='\n'+U.lesH.toUpperCase()+'\n'+E.top.map(i=>`- ${T.axes[i].name}: ${E.line(i)}${E.sideTag(i)?' ('+E.sideTag(i)+')':''}`).join('\n')+'\n';
  t+='\n'+U.hypoH.toUpperCase()+'\n'+(E.hypo||U.hypoNone)+'\n';
  E.opp.forEach(o=>{t+='\n'+U.oppH.toUpperCase()+'\n'+o+'\n'});
  if(E.locked.length)t+='\n'+U.gegenH.toUpperCase()+'\n'+U.gegen+'\n';
  t+='\n'+U.glossH.toUpperCase()+'\n'+U.gloss.map(g=>`- ${g[0]}: ${g[1]}`).join('\n')+'\n';
  t+='\n'+U.sayH.toUpperCase()+'\n'+E.say.map(s=>`- ${QQ(s.t)} (${s.w})`).join('\n')+'\n';
  t+='\n'+(E.addressee?fill(U.askHTo,{n:E.addressee}):S.role===0?U.askHOther:U.askH).toUpperCase()+'\n'+E.ask.map(s=>`- ${s.t} (${s.w})`).join('\n')+'\n';
  if(E.refl.length)t+='\n'+U.reflH.toUpperCase()+'\n'+E.refl.map(s=>`- ${s.t} (${s.w})`).join('\n')+'\n';
  t+='\n'+U.profH.toUpperCase()+'\n'+T.axes.map((a,i)=>{const v=S.v[i];const st=Math.abs(v)===2?(v>0?a.poleA:a.poleB)+' · '+U.st.lock+(E.sideTag(i)?', '+E.sideTag(i):''):v===0?U.st.zero:(v>0?a.poleA:a.poleB)+' · '+U.st.tend+(E.sideTag(i)?', '+E.sideTag(i):'');return `- ${a.name}: ${st}`}).join('\n')+'\n';
  return t+'\n'+U.pFoot1+'\n'+U.pFoot2;
}
function copySum(E){
  const t=sumText(E),msg=$('#copyMsg'),ta=$('#copyFallback');
  const ok=()=>{ta.hidden=true;msg.textContent=U.copied};
  const fb=()=>{ta.hidden=false;ta.value=t;ta.focus();ta.select();msg.textContent=U.copyFail};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
}
function printSum(E){
  const c=E.c;
  const date=new Date().toLocaleDateString(L==='de'?'de-DE':'en-GB',{day:'numeric',month:'long',year:'numeric'});
  const dots=v=>{const pos=v===2?4:v===1?3:v===-1?1:v===-2?0:-1;return[0,1,2,3,4].map(k=>`<span class="dot${k===pos?(Math.abs(v)===2?' lock':' on'):''}"></span>`).join('')};
  const tagCls=E.verdict==='bug'?'':E.verdict==='feature'?' feature':' schwel';
  let p1=`<section class="pg"><header><div><div class="kicker">${esc(fill(U.pKick1,{date}))}</div><h1>${U.p1H}</h1></div><img src="${LOGO_PRINT}" alt=""></header><main>`;
  p1+=`<div class="pv"><div class="tag${tagCls}">${U.verdict[E.verdict]}</div><div class="count"><b>${esc(E.count)}</b> ${E.vtext} ${esc(U.pRole[S.role])}${E.addressee?' '+esc(fill(U.pNext,{n:E.addressee})):''}${S.topic.trim()?' '+esc(fill(U.aboutTopic,c)):''}</div></div>`;
  p1+=`<div class="pprof">`;let ld='';
  T.axes.forEach((a,i)=>{if(a.dim!==ld){p1+=`<div class="pdim">${U.dims[a.dim]} · ${esc(T.bridges[a.dim].split(':').slice(1).join(':').trim())}</div>`;ld=a.dim}
    const v=S.v[i],lock=Math.abs(v)===2;const who=lock?(E.sideTag(i)||'')+'':(v===0?U.st.zero:U.st.tend+(E.sideTag(i)&&E.sideTag(i)!==U.st.both?', '+E.sideTag(i):''));
    p1+=`<div class="prw"><div class="axis">${a.name}</div><div class="pole">${esc(a.poleB)}</div><div class="scale">${dots(v)}</div><div class="pole r">${esc(a.poleA)}</div><div class="who${lock?' lock':''}">${esc(who)}</div></div>`});
  p1+=`</div>`;
  if(E.top.length)p1+=`<div class="ples"><h2>${U.lesH}<span>.</span></h2>${E.top.map(i=>`<p><b>${T.axes[i].name}</b>${esc(E.line(i))}</p>`).join('')}</div>`;
  p1+=`<div class="hypo"><b>${U.hypoH}</b><p style="margin:1mm 0 0">${esc(E.hypo||U.hypoNone)}</p></div>`;
  E.opp.forEach(o=>{p1+=`<div class="hypo"><b>${U.oppH}</b><p style="margin:1mm 0 0">${esc(o)}</p></div>`});
  if(E.nZero>=4)p1+=`<div class="hypo"><b>${U.unusedH}</b><p style="margin:1mm 0 0">${esc(fill(U.unused,{n:numw(E.nZero)}))}</p></div>`;
  p1+=`</main><footer><div>${U.pFoot1}</div><div>${U.pSite} · 1/2</div></footer></section>`;
  const frame=S.role===1?fill(U.frame2,{other:(S.next===0?c.B:S.next===1?c.A:(L==='de'?'Die andere Seite':'The other side'))}):S.role===2?U.frame3:(E.nP>=E.nM?U.frame1P:U.frame1M);
  const askH=E.addressee?fill(U.askHTo,{n:E.addressee}):(S.role===0?U.askHOther:U.askH);
  let p2=`<section class="pg"><header><div><div class="kicker">${esc(fill(U.pKick2,{to:E.addressee?fill(U.pTo,{n:E.addressee}):''}))}</div><h1>${U.p2H}</h1></div><img src="${LOGO_PRINT}" alt=""></header><main>`;
  p2+=`<div class="pframe"><h3>${U.frameH}</h3><p>${esc(frame)}</p></div>`;
  p2+=`<div class="pblock"><h2>${U.sayH}<span>.</span></h2><ul class="say">${E.say.map(s=>`<li><span class="t">${esc(s.t)}</span><span class="why">${esc(s.w)}</span></li>`).join('')}</ul></div>`;
  p2+=`<div class="two"><div class="pblock"><h2>${esc(askH)}<span>.</span></h2><ol>${E.ask.map(s=>`<li><span class="q">${esc(s.t)}</span><span class="why">${esc(s.w)}</span></li>`).join('')}</ol></div>`;
  p2+=`<div class="pblock"><h2>${U.reflH}<span>.</span></h2><p class="small">${S.role===0?U.reflSubSelf:U.reflSub}</p><ol>${E.refl.map(s=>`<li><span class="q">${esc(s.t)}</span><span class="why">${esc(s.w)}</span></li>`).join('')}</ol></div></div>`;
  if(E.locked.length)p2+=`<div class="gegen"><b>${U.gegenH}</b> · ${U.gegen}</div>`;
  p2+=`<div class="pgloss"><h3>${U.glossH}</h3>${U.gloss.map(g=>`<p><b>${esc(g[0])}</b> ${esc(g[1])}</p>`).join('')}</div>`;
  p2+=`</main><footer><div>${U.pFoot2}</div><div>${U.pCoach} · 2/2</div></footer></section>`;
  $('#printSheet').innerHTML=p1+p2;
  window.print();
}

$('#foot').textContent=T.foot;
show(0);

/* iframe integration: report height and step changes to the parent page */
(function(){
  function report(){try{parent.postMessage({jnApp:'height',h:document.documentElement.scrollHeight},'*')}catch(e){}}
  var ro=window.ResizeObserver?new ResizeObserver(report):null;
  if(ro)ro.observe(document.body);
  window.addEventListener('load',report);
  var _show=show;show=function(n){_show(n);try{parent.postMessage({jnApp:'top'},'*')}catch(e){};setTimeout(report,50)};
})();
</script>
